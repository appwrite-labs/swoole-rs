[package]
name = "swoole-rs-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
swoole-rs-base64 = { path = "../crates/base64" }
swoole-rs-clients = { path = "../crates/clients" }
swoole-rs-framing = { path = "../crates/framing" }
swoole-rs-http = { path = "../crates/http" }
swoole-rs-http-ffi = { path = "../crates/http-ffi" }
swoole-rs-http2 = { path = "../crates/http2" }
libc = "=0.2.191"
swoole-rs-oracle = { path = "../crates/oracle" }
swoole-rs-protocols = { path = "../crates/protocols" }
swoole-rs-protocols-ffi = { path = "../crates/protocols-ffi" }
swoole-rs-utilities = { path = "../crates/utilities" }
swoole-rs-websocket = { path = "../crates/websocket" }

