[package]
name = "swoole-rs-corebase"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# Define base.cc's helpers under their C++ symbols. Only crates/ffi, whose builds apply
# the corebase patches that delete the C++ definitions, turns it on; another crate
# linking this one would otherwise duplicate them.
upstream-symbols = ["dep:cc"]

[dependencies]
swoole-rs-error = { path = "../error" }
itoa = "1.0.18"
libc = "=0.2.191"
swoole-rs-framing = { path = "../framing" }

[build-dependencies]
cc = { version = "=1.10.0", optional = true }

[lib]
name = "swoole_rs_corebase"
crate-type = ["rlib"]

# The resolver record's former native gate and C++ witnesses (tests/modules/corebase/README.md).
[[test]]
name = "resolver"
path = "../../tests/modules/corebase/resolver.rs"

# The former corebase-native gate: the number helpers against the pinned base.cc
# bodies (tests/modules/corebase/README.md).
[[test]]
name = "numbers"
path = "../../tests/modules/corebase/numbers.rs"

[dev-dependencies]
swoole-rs-oracle = { path = "../oracle" }

[lints]
workspace = true
