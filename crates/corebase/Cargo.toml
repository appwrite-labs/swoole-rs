[package]
name = "swoole-rs-corebase"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true

[features]
# `log::capture`, which other crates' tests read Rust logs through.
log-capture = []
# `Heap::from_static` and `SocketRecord::into_socket`: test fixtures' records with no owner,
# which other crates' tests make (#5276). No production build enables it.
test-records = []
# Worker globals are per thread for SW_THREAD builds without thread-safe PHP.
thread = []
# `--fix-halfclose`: TLS close_notify and interrupted-sendfile repairs.
halfclose = []

[dependencies]
memchr = "2.8.3"
swoole-rs-base64 = { path = "../base64" }
swoole-rs-error = { path = "../error" }
swoole-rs-error-ffi = { path = "../error-ffi" }
itoa = "1.0.18"
libc = "=0.2.191"
swoole-rs-framing = { path = "../framing" }

[target.'cfg(unix)'.dependencies]
openssl-sys = "=0.9.118"

[build-dependencies]
cc = "=1.11.1"

[lib]
name = "swoole_rs_corebase"
crate-type = ["rlib"]

# The resolver record's former native gate and C++ witnesses (tests/modules/corebase/README.md).
[[test]]
name = "resolver"
path = "../../tests/modules/corebase/resolver.rs"

# The former corebase-native gate: the number helpers against the pinned base.cc
# bodies (tests/modules/corebase/README.md).
[[test]]
name = "numbers"
path = "../../tests/modules/corebase/numbers.rs"

# The original pthread and constructor-fault witnesses, kept with the locks module.
[[test]]
name = "locks_gate"
path = "../../tests/modules/locks/gate.rs"

[[test]]
name = "locks_constructor"
path = "../../tests/modules/locks/constructor.rs"

[[test]]
name = "hash_originals"
path = "../../tests/modules/utilities/hash.rs"

[dev-dependencies]
swoole-rs-crc32 = { path = "../crc32" }
swoole-rs-oracle = { path = "../oracle" }

# The identifiers no C header exports, for tests/modules/corebase/constants.py.
[[example]]
name = "constants"
path = "../../tests/modules/corebase/corebase_enums.rs"

[[example]]
name = "tls-constants"
path = "../../tests/modules/corebase/tls_enums.rs"

[lints]
workspace = true
