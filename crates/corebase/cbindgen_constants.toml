language = "C"
include_guard = "SWOOLE_RS_COREBASE_CONSTANTS_H"
cpp_compat = true
no_includes = true
sys_includes = ["stdint.h"]
documentation = false
autogen_warning = "/* Generated from crates/corebase by cbindgen (tools/headers.sh); do not edit. */"
[export]
item_types = ["constants", "enums"]
# The enums native code reads; the rest stay in Rust (tests/modules/corebase/constants.py).
include = ["FdType", "SocketType", "ForkType", "SW_IPC_MAX_SIZE", "SW_IPC_BUFFER_SIZE"]
exclude = ["SW_PIPE_READ", "SW_PIPE_WRITE"]
[export.rename]
"FdType" = "swFdType"
"SocketType" = "swSocketType"
"ForkType" = "swForkType"
[enum]
prefix_with_name = false
[defines]
"target_vendor = apple" = "__MACH__"
