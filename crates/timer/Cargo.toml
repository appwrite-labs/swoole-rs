[package]
name = "swoole-rs-timer"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true

[lib]
name = "swoole_rs_timer"
crate-type = ["rlib", "staticlib"]

[features]
# Thread-local timer ownership and reactor integration, replacing src/wrapper/timer.cc.
upstream-symbols = ["dep:swoole-rs-reactor", "swoole-rs-reactor/upstream-symbols"]

# The typed PHP timer boundary consumes a Zend callable, never a raw callback/data pair.
php = ["upstream-symbols", "dep:swoole-rs-zend", "swoole-rs-zend/php"]

[dependencies]
swoole-rs-error = { path = "../error" }
libc = "=0.2.191"
swoole-rs-corebase = { path = "../corebase" }
swoole-rs-reactor = { path = "../reactor", optional = true }

swoole-rs-zend = { path = "../zend", optional = true }

[lints]
workspace = true
