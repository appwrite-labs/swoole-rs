[package]
name = "swoole-rs-phpruntime"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "PHP Swoole\\Runtime: hook flags and the function-table hooks behind enableCoroutine"

[lib]
name = "swoole_rs_phpruntime"
crate-type = ["rlib"]

[features]
# Native curl (crates/ffi's curl, with --enable-swoole-curl): its MINIT.
curl = []
# Needs PHP headers (swoole-rs-zend-sys); without it the crate is empty.
php = ["dep:swoole-rs-hooks", "dep:swoole-rs-zend", "swoole-rs-zend/php", "dep:libc", "dep:swoole-rs-phpstubs", "swoole-rs-phpstubs/php", "dep:swoole-rs-corebase", "dep:swoole-rs-error", "dep:swoole-rs-phpswoole", "swoole-rs-phpswoole/php"]

[dependencies]
libc = { version = "=0.2.191", optional = true }
swoole-rs-hooks = { path = "../hooks", optional = true }
swoole-rs-zend = { path = "../zend", optional = true }
swoole-rs-corebase = { path = "../corebase", optional = true }
swoole-rs-error = { path = "../error", optional = true }
swoole-rs-phpswoole = { path = "../phpswoole", optional = true }
swoole-rs-phpstubs = { path = "../phpstubs", optional = true }

[lints]
workspace = true

[[example]]
name = "fresh_socket"
crate-type = ["cdylib"]
path = "../../tests/modules/clients/fresh_socket.rs"
required-features = ["php"]
