[package]
name = "swoole-rs-phpruntime"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "PHP Swoole\\Runtime: hook flags and the function-table hooks behind enableCoroutine"

[lib]
name = "swoole_rs_phpruntime"
crate-type = ["rlib"]

[features]
# Needs PHP headers (swoole-rs-zend-sys); without it the crate is empty.
# Defines the Rust bodies under their upstream C++ symbols.
upstream-symbols = []
# Native curl (crates/ffi's curl, with --enable-swoole-curl): its MINIT and MSHUTDOWN.
curl = []
php = ["dep:swoole-rs-zend", "swoole-rs-zend/php", "dep:libc", "dep:openssl-sys", "dep:swoole-rs-phpstubs", "swoole-rs-phpstubs/php", "dep:swoole-rs-corebase", "dep:swoole-rs-error-ffi", "dep:swoole-rs-phpswoole", "swoole-rs-phpswoole/php", "dep:swoole-rs-utilities", "dep:swoole-rs-tls", "dep:swoole-rs-phphelpers", "swoole-rs-phphelpers/php"]

[dependencies]
libc = { version = "=0.2.191", optional = true }
openssl-sys = { version = "=0.9.117", optional = true }
swoole-rs-hooks = { path = "../hooks" }
swoole-rs-reactor = { path = "../reactor" }
swoole-rs-zend = { path = "../zend", optional = true }
swoole-rs-corebase = { path = "../corebase", optional = true }
swoole-rs-error-ffi = { path = "../error-ffi", optional = true }
swoole-rs-phpswoole = { path = "../phpswoole", optional = true }
swoole-rs-utilities = { path = "../utilities", optional = true }
swoole-rs-tls = { path = "../tls", optional = true }
swoole-rs-phpstubs = { path = "../phpstubs", optional = true }
swoole-rs-phphelpers = { path = "../phphelpers", optional = true }

[lints]
workspace = true
