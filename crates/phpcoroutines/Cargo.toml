[package]
name = "swoole-rs-phpcoroutines"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "PHP coroutines: each coroutine's PHP context and VM swap, activation and Swoole\\Coroutine"

[features]
# Needs PHP headers (swoole-rs-zend-sys); without it the crate is empty.
php = ["dep:libc", "dep:swoole-rs-zend", "swoole-rs-zend/php", "dep:swoole-rs-phpstubs", "swoole-rs-phpstubs/php", "dep:swoole-rs-phphelpers", "swoole-rs-phphelpers/php",
       "dep:swoole-rs-phpswoole", "swoole-rs-phpswoole/php", "dep:swoole-rs-phpruntime", "swoole-rs-phpruntime/php",
       "dep:swoole-rs-coroutine", "swoole-rs-coroutine/upstream-symbols", "dep:swoole-rs-corebase", "dep:swoole-rs-hooks", "dep:swoole-rs-buffer",
       "dep:swoole-rs-reactor", "dep:swoole-rs-server", "dep:swoole-rs-timer", "swoole-rs-timer/upstream-symbols"]
# Co::stats() reports the io_uring engine (upstream's SW_USE_IOURING); crates/ffi's iouring.
iouring = ["swoole-rs-hooks?/iouring", "swoole-rs-hooks?/upstream-symbols"]

[dependencies]
libc = { version = "=0.2.191", optional = true }
swoole-rs-zend = { path = "../zend", optional = true }
swoole-rs-phpstubs = { path = "../phpstubs", optional = true }
swoole-rs-phphelpers = { path = "../phphelpers", optional = true }
swoole-rs-phpswoole = { path = "../phpswoole", optional = true }
swoole-rs-phpruntime = { path = "../phpruntime", optional = true }
swoole-rs-coroutine = { path = "../coroutine", optional = true }
swoole-rs-corebase = { path = "../corebase", optional = true }
swoole-rs-hooks = { path = "../hooks", optional = true }
swoole-rs-buffer = { path = "../buffer", optional = true }
swoole-rs-reactor = { path = "../reactor", optional = true }
swoole-rs-server = { path = "../server", optional = true }
swoole-rs-timer = { path = "../timer", optional = true }

[lints]
workspace = true
