[package]
name = "swoole-rs-phptimer"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "PHP Swoole\\Timer over crates/timer"

[features]
# Needs PHP headers (swoole-rs-zend-sys); without it the crate is empty.
php = ["dep:swoole-rs-zend", "swoole-rs-zend/php", "dep:swoole-rs-phpstubs", "swoole-rs-phpstubs/php",
       "dep:swoole-rs-timer", "swoole-rs-timer/upstream-symbols", "dep:swoole-rs-corebase",
       "dep:swoole-rs-phpcoroutines", "swoole-rs-phpcoroutines/php",
       "dep:swoole-rs-phpswoole", "swoole-rs-phpswoole/php", "dep:swoole-rs-phpprocess", "swoole-rs-phpprocess/php"]

[dependencies]
swoole-rs-zend = { path = "../zend", optional = true }
swoole-rs-phpstubs = { path = "../phpstubs", optional = true }
swoole-rs-timer = { path = "../timer", optional = true }
swoole-rs-corebase = { path = "../corebase", optional = true }
swoole-rs-phpcoroutines = { path = "../phpcoroutines", optional = true }
swoole-rs-phpswoole = { path = "../phpswoole", optional = true }
swoole-rs-phpprocess = { path = "../phpprocess", optional = true }

[lints]
workspace = true
