[package]
name = "swoole-rs-phphelpers"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
name = "swoole_rs_phphelpers"
crate-type = ["rlib"]

[features]
php = ["dep:swoole-rs-zend", "swoole-rs-zend/php", "dep:libc"]

[dependencies]
swoole-rs-zend = { path = "../zend", optional = true }
libc = { version = "=0.2.191", optional = true }

[lints]
workspace = true
