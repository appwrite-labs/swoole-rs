[package]
name = "swoole-rs-ext"
version.workspace = true
edition = "2024"
publish = false
license.workspace = true
description = "swoole.so built by Cargo: the module crates linked with native/ and the bundled C, compiled by build.rs"

[lib]
name = "swoole"
crate-type = ["cdylib"]
test = false
doctest = false

# Upstream configure switches accepted by tools/build_ext.py.
[package.metadata.configure]
"--enable-iouring" = "iouring"
"--enable-uring-socket" = "uring-socket"
"--enable-cares" = "cares"
"--enable-thread-context" = "thread-context"
"--enable-swoole-thread" = "thread"
"--enable-swoole-stdext" = "stdext"
"--enable-mysqlnd" = "mysqlnd"
"--enable-swoole-pgsql" = "pgsql"
"--with-swoole-odbc" = "odbc"
"--with-swoole-firebird" = "firebird"
"--enable-swoole-sqlite" = "sqlite"
"--with-swoole-oracle" = "oci"
"--enable-swoole-curl" = "curl"
"--with-swoole-ssh2" = "ssh2"

[features]
# Build the extension for the PHP that `$PHP_CONFIG` names (tools/build_ext.py sets it).
# Without both, the crate links no native code.
php = ["swoole-rs-ffi/php", "dep:cc", "dep:openssl-sys"]
sockets = ["swoole-rs-ffi/sockets"]
mysqlnd = []
pgsql = ["swoole-rs-ffi/pgsql"]
odbc = ["swoole-rs-ffi/odbc"]
firebird = ["swoole-rs-ffi/firebird"]
sqlite = ["swoole-rs-ffi/sqlite"]
oci = ["swoole-rs-ffi/oci"]
curl = ["swoole-rs-ffi/curl"]
ssh2 = ["swoole-rs-ffi/ssh2"]
stdext = ["swoole-rs-ffi/stdext"]
halfclose = ["swoole-rs-ffi/halfclose"]
iouring = ["swoole-rs-ffi/iouring"]
uring-socket = ["iouring"]
cares = ["swoole-rs-ffi/cares"]
thread-context = []
thread = []

[dependencies]
swoole-rs-ffi = { path = "../ffi" }
# Only for DEP_OPENSSL_INCLUDE: native/tls includes the OpenSSL the Rust side links.
openssl-sys = { version = "=0.9.118", optional = true }

[build-dependencies]
cc = { version = "=1.11.1", optional = true }

[lints]
workspace = true
