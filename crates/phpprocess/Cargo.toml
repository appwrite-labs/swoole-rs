[package]
name = "swoole-rs-phpprocess"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "PHP Swoole\\Process class over the Worker, pipe and queue objects C++ keeps"

[features]
# Needs PHP headers (swoole-rs-zend-sys); without it the crate is empty.
php = ["dep:swoole-rs-zend", "swoole-rs-zend/php", "dep:libc", "dep:swoole-rs-phpstubs", "swoole-rs-phpstubs/php"]

[dependencies]
libc = { version = "=0.2.191", optional = true }
swoole-rs-zend = { path = "../zend", optional = true }
swoole-rs-phpstubs = { path = "../phpstubs", optional = true }

[lints]
workspace = true
