[package]
name = "swoole-rs-phpprocess"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "PHP Swoole\\Process class over the Worker record, its pipe and queue"

[features]
# Needs PHP headers (swoole-rs-zend-sys); without it the crate is empty.
php = ["dep:swoole-rs-zend", "swoole-rs-zend/php", "dep:libc", "dep:swoole-rs-phpstubs", "swoole-rs-phpstubs/php",
       "dep:swoole-rs-process", "swoole-rs-process/upstream-symbols", "dep:swoole-rs-ossupport", "dep:swoole-rs-corebase",
       "dep:swoole-rs-phpswoole", "dep:swoole-rs-reactor", "dep:swoole-rs-tls", "swoole-rs-phpswoole/php", "dep:swoole-rs-phpcoroutines", "swoole-rs-phpcoroutines/php",
       "dep:swoole-rs-phphelpers", "swoole-rs-phphelpers/php", "dep:swoole-rs-server",
       "dep:swoole-rs-phpclients", "swoole-rs-phpclients/php"]

[dependencies]
libc = { version = "=0.2.191", optional = true }
swoole-rs-zend = { path = "../zend", optional = true }
swoole-rs-phpstubs = { path = "../phpstubs", optional = true }
swoole-rs-process = { path = "../process", optional = true }
swoole-rs-ossupport = { path = "../ossupport", optional = true }
swoole-rs-corebase = { path = "../corebase", optional = true }
swoole-rs-phpswoole = { path = "../phpswoole", optional = true }
swoole-rs-phpclients = { path = "../phpclients", optional = true }
swoole-rs-reactor = { path = "../reactor", optional = true }
swoole-rs-tls = { path = "../tls", optional = true }
swoole-rs-phpcoroutines = { path = "../phpcoroutines", optional = true }
swoole-rs-phphelpers = { path = "../phphelpers", optional = true }
swoole-rs-server = { path = "../server", optional = true }

[lints]
workspace = true
