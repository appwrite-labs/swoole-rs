[package]
name = "swoole-rs-protocols-ffi"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "swoole_rs_protocols_ffi"
crate-type = ["rlib"]

[lints]
workspace = true

[dependencies]
swoole-rs-error = { path = "../error" }
libc = "=0.2.191"
swoole-rs-corebase = { path = "../corebase" }
swoole-rs-clients = { path = "../clients" }
swoole-rs-protocols = { path = "../protocols" }
swoole-rs-reactor = { path = "../reactor" }

[dev-dependencies]
swoole-rs-oracle = { path = "../oracle" }

# The receive loop against the pinned redis.cc, and the handler-key model
# (tests/modules/protocols/README.md).
[[test]]
name = "native"
path = "../../tests/modules/protocols/native.rs"
