[package]
name = "swoole-rs-odbc"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Swoole's coroutine ODBC calls for its bundled pdo_odbc (--with-swoole-odbc)"

[features]
# MINIT's PDO registration, which needs PHP headers (swoole-rs-zend).
php = ["dep:swoole-rs-zend", "swoole-rs-zend/php"]

[dependencies]
swoole-rs-hooks = { path = "../hooks" }
swoole-rs-zend = { path = "../zend", optional = true }
# The system unixODBC, as upstream links it.
swoole-rs-odbc-sys = { path = "../odbc-sys", features = ["unixodbc"] }

[lints]
workspace = true
