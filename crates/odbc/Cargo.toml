[package]
name = "swoole-rs-odbc"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Swoole's coroutine ODBC calls for its bundled pdo_odbc (--with-swoole-odbc)"

[dependencies]
