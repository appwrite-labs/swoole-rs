[package]
name = "swoole-rs-locks"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
libc = "=0.2.191"
swoole-rs-corebase = { path = "../corebase" }
swoole-rs-error = { path = "../error" }

[dev-dependencies]
swoole-rs-oracle = { path = "../oracle" }

# The former native gates (tests/modules/locks/README.md): gate.cc against the pinned
