[package]
name = "swoole-rs-websocket-ffi"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "swoole_rs_websocket_ffi"
crate-type = ["rlib"]

[lints]
workspace = true

[features]
# Define websocket.cc's functions under their C++ symbols. Only crates/ffi, whose builds
# apply the patch that deletes src/protocol/websocket.cc, turns it on.
upstream-symbols = []

[dependencies]
swoole-rs-error = { path = "../error" }
libc = "=0.2.191"
swoole-rs-buffer = { path = "../buffer" }
swoole-rs-corebase = { path = "../corebase" }
swoole-rs-websocket = { path = "../websocket" }

[dev-dependencies]
swoole-rs-oracle = { path = "../oracle" }

# The codec against the pinned C++ bodies (tests/modules/websocket/README.md).
[[test]]
name = "codec"
path = "../../tests/modules/websocket/codec.rs"
