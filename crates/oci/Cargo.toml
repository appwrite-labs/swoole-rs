[package]
name = "swoole-rs-oci"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "Swoole's coroutine OCI calls for its bundled pdo_oci (--with-swoole-oracle)"

[features]
# MINIT's PDO registration, which needs PHP headers (swoole-rs-zend).
php = ["dep:swoole-rs-corebase", "dep:swoole-rs-zend", "swoole-rs-zend/php"]

[dependencies]
swoole-rs-corebase = { path = "../corebase", optional = true }
swoole-rs-hooks = { path = "../hooks" }
swoole-rs-zend = { path = "../zend", optional = true }

[lints]
workspace = true
