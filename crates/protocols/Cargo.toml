[package]
name = "swoole-rs-protocols"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "swoole_rs_protocols"
crate-type = ["rlib", "staticlib"]

[features]
# redis::recv_packet and the bus's socket writes and frees under their upstream symbols, over the server, tls and buffer crates.
upstream-symbols = ["dep:swoole-rs-buffer", "dep:swoole-rs-server", "dep:swoole-rs-tls"]

[lints]
workspace = true

[dependencies]
libc = "=0.2.191"
swoole-rs-corebase = { path = "../corebase" }
swoole-rs-clients = { path = "../clients" }
swoole-rs-reactor = { path = "../reactor" }
swoole-rs-buffer = { path = "../buffer", optional = true }
swoole-rs-server = { path = "../server", optional = true }
swoole-rs-tls = { path = "../tls", optional = true }
