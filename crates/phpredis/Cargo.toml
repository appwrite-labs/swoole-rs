[package]
name = "swoole-rs-phpredis"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "PHP Swoole\\Redis\\Server over the zend crates and the protocols crate's RESP"

[features]
# Needs PHP headers (swoole-rs-zend-sys); without it the crate is empty.
php = ["dep:swoole-rs-zend", "swoole-rs-zend/php", "dep:swoole-rs-phpstubs", "swoole-rs-phpstubs/php", "dep:swoole-rs-phpserver", "swoole-rs-phpserver/php", "swoole-rs-phpserver/server", "dep:swoole-rs-phpcoroutines", "swoole-rs-phpcoroutines/php", "dep:swoole-rs-phpswoole", "swoole-rs-phpswoole/php", "dep:swoole-rs-corebase", "dep:swoole-rs-server", "dep:libc"]

[dependencies]
swoole-rs-error = { path = "../error" }
swoole-rs-protocols = { path = "../protocols" }
swoole-rs-zend = { path = "../zend", optional = true }
swoole-rs-phpstubs = { path = "../phpstubs", optional = true }
swoole-rs-phpserver = { path = "../phpserver", optional = true }
swoole-rs-phpcoroutines = { path = "../phpcoroutines", optional = true }
swoole-rs-phpswoole = { path = "../phpswoole", optional = true }
swoole-rs-corebase = { path = "../corebase", optional = true }
swoole-rs-server = { path = "../server", optional = true }
libc = { version = "=0.2.191", optional = true }

[lints]
workspace = true
