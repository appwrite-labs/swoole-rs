[package]
name = "swoole-rs-phplocks"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "PHP Swoole\\Atomic and Swoole\\Thread\\Atomic classes over the locks crate"

[features]
# Needs PHP headers (swoole-rs-zend-sys); without it the crate is empty.
php = ["dep:swoole-rs-locks", "dep:swoole-rs-hooks", "dep:swoole-rs-zend", "swoole-rs-zend/php", "dep:swoole-rs-phpstubs", "swoole-rs-phpstubs/php",
       "dep:swoole-rs-memory", "dep:swoole-rs-corebase", "dep:swoole-rs-phpswoole", "swoole-rs-phpswoole/php",
       "dep:swoole-rs-phpcoroutines", "swoole-rs-phpcoroutines/php", "dep:swoole-rs-utilities"]
# Coroutine\Lock waits on io_uring futexes (upstream's HAVE_IOURING_FUTEX); crates/ffi's iouring.
iouring = ["dep:swoole-rs-hooks", "swoole-rs-hooks/iouring", "swoole-rs-hooks/upstream-symbols"]

[dependencies]
swoole-rs-locks = { path = "../locks", optional = true }
swoole-rs-zend = { path = "../zend", optional = true }
swoole-rs-phpstubs = { path = "../phpstubs", optional = true }
swoole-rs-memory = { path = "../memory", optional = true }
swoole-rs-corebase = { path = "../corebase", optional = true }
swoole-rs-phpswoole = { path = "../phpswoole", optional = true }
swoole-rs-phpcoroutines = { path = "../phpcoroutines", optional = true }
swoole-rs-hooks = { path = "../hooks", optional = true }
swoole-rs-utilities = { path = "../utilities", optional = true }

[lints]
workspace = true
