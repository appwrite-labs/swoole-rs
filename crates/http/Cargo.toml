[package]
name = "swoole-rs-http"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
name = "swoole_rs_http"
crate-type = ["rlib"]

[features]
# Define the upstream C++ symbols of `src/upstream.rs`; only the hybrid's archive,
# whose http.cc no longer defines them, turns it on.
upstream-symbols = []

[dependencies]
libc = "=0.2.191"
memchr = "2.8.3"
regex-automata = "0.4.18"
swoole-rs-corebase = { path = "../corebase" }
swoole-rs-base64 = { path = "../base64" }

[dev-dependencies]
swoole-rs-oracle = { path = "../oracle" }

[lints]
workspace = true
