[package]
name = "swoole-rs-http"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
name = "swoole_rs_http"
crate-type = ["rlib"]

[dependencies]
libc = "=0.2.191"
memchr = "2.8.3"
swoole-rs-base64 = { path = "../base64" }
swoole-rs-locale = { path = "../locale" }

[dev-dependencies]
swoole-rs-oracle = { path = "../oracle" }

[lints]
workspace = true

[[test]]
name = "multipart_parser"
path = "../../tests/modules/http/multipart_parser.rs"
