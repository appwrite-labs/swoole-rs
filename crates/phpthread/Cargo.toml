[package]
name = "swoole-rs-phpthread"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "PHP Swoole\\Thread and its Map, ArrayList, Queue and Barrier"

[features]
# Needs PHP headers (swoole-rs-zend-sys); without it the crate is empty.
php = ["dep:swoole-rs-zend", "swoole-rs-zend/php", "dep:libc", "dep:swoole-rs-phpprocess", "swoole-rs-phpprocess/php", "dep:swoole-rs-phpstubs", "swoole-rs-phpstubs/php", "dep:swoole-rs-phplocks", "swoole-rs-phplocks/php",
       "dep:swoole-rs-phpswoole", "swoole-rs-phpswoole/php", "dep:swoole-rs-phpcoroutines", "swoole-rs-phpcoroutines/php",
       "dep:swoole-rs-phpclients", "swoole-rs-phpclients/php",
       "dep:swoole-rs-corebase", "dep:swoole-rs-error", "dep:swoole-rs-ossupport", "dep:swoole-rs-reactor"]

[dependencies]
libc = { version = "=0.2.191", optional = true }
swoole-rs-zend = { path = "../zend", optional = true }
swoole-rs-phpstubs = { path = "../phpstubs", optional = true }
swoole-rs-phpprocess = { path = "../phpprocess", optional = true }
swoole-rs-phplocks = { path = "../phplocks", optional = true }
swoole-rs-phpswoole = { path = "../phpswoole", optional = true }
swoole-rs-phpcoroutines = { path = "../phpcoroutines", optional = true }
swoole-rs-phpclients = { path = "../phpclients", optional = true }
swoole-rs-corebase = { path = "../corebase", optional = true }
swoole-rs-error = { path = "../error", optional = true }
swoole-rs-ossupport = { path = "../ossupport", optional = true }
swoole-rs-reactor = { path = "../reactor", optional = true }

[lints]
workspace = true
