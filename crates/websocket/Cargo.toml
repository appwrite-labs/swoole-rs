[package]
name = "swoole-rs-websocket"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true

[lib]
name = "swoole_rs_websocket"
crate-type = ["rlib"]

[lints]
workspace = true

[dependencies]
swoole-rs-base64 = { path = "../base64" }
swoole-rs-corebase = { path = "../corebase" }

[dev-dependencies]
swoole-rs-oracle = { path = "../oracle" }

# The codec against the pinned C++ bodies (tests/modules/websocket/README.md).
[[test]]
name = "codec"
path = "../../tests/modules/websocket/codec.rs"
