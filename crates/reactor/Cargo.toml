[package]
name = "swoole-rs-reactor"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true

[features]
default = []
# Publish original C++ method symbols only for the activated reactor overlay.
upstream-symbols = ["swoole-rs-corebase/upstream-symbols"]

[dependencies]
swoole-rs-corebase = { path = "../corebase" }
swoole-rs-error = { path = "../error" }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"
openssl-sys = "=0.9.118"

[dev-dependencies]
swoole-rs-corebase = { path = "../corebase", features = ["log-capture"] }

[lib]
crate-type = ["rlib", "staticlib"]

[lints]
workspace = true
