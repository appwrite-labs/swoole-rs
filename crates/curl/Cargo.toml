[package]
name = "swoole-rs-curl"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "Swoole's coroutine cURL multi engine (--enable-swoole-curl)"

[features]
# swr_v1_curl_check_handle, which reads the module globals and reports PHP
# errors; needs PHP headers (swoole-rs-zend-sys).
php = ["dep:swoole-rs-zend", "swoole-rs-zend/php", "dep:swoole-rs-phpswoole", "swoole-rs-phpswoole/php"]

[dependencies]
swoole-rs-error = { path = "../error" }
libc = "=0.2.191"
swoole-rs-corebase = { path = "../corebase", features = ["upstream-symbols"] }
swoole-rs-curl-sys = { path = "../curl-sys" }
swoole-rs-phpswoole = { path = "../phpswoole", optional = true }
swoole-rs-zend = { path = "../zend", optional = true }

[lints]
workspace = true
