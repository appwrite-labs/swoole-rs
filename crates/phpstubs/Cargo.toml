[package]
name = "swoole-rs-phpstubs"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Every upstream stub's arginfo as Rust statics, generated by tools/arginfo.py"

[features]
# Needs PHP headers (swoole-rs-zend-sys); without it the crate is empty.
php = ["dep:swoole-rs-zend", "swoole-rs-zend/php"]

[dependencies]
swoole-rs-zend = { path = "../zend", optional = true }

[lints]
workspace = true
