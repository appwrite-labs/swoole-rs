[package]
name = "swoole-rs-phphttp2"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "PHP HTTP/2 client classes (Swoole\\Coroutine\\Http2\\Client, Swoole\\Http2\\Request, Swoole\\Http2\\Response) over the zend crate"

[features]
# Needs PHP headers (swoole-rs-zend-sys); without it the crate is empty.
php = [
    "dep:libc",
    "dep:swoole-rs-inflate",
    "dep:swoole-rs-http2",
    "dep:swoole-rs-hooks",
    "dep:swoole-rs-zend",
    "swoole-rs-zend/php",
    "dep:swoole-rs-phpstubs",
    "swoole-rs-phpstubs/php",
    "dep:swoole-rs-phphttp",
    "swoole-rs-phphttp/php",
    "dep:swoole-rs-phpclients",
    "swoole-rs-phpclients/php",
    "dep:swoole-rs-phpruntime",
    "swoole-rs-phpruntime/php",
    "dep:swoole-rs-reactor",
    "dep:swoole-rs-corebase",
    "dep:swoole-rs-error",
    "dep:swoole-rs-framing",
    "dep:swoole-rs-phpcoroutines",
    "swoole-rs-phpcoroutines/php",
    "dep:swoole-rs-phpserver",
    "swoole-rs-phpserver/php",
    "swoole-rs-phpserver/server",
    "dep:swoole-rs-server",
    "dep:swoole-rs-ports",
    "dep:swoole-rs-phpswoole",
    "swoole-rs-phpswoole/php",
]

[dependencies]
libc = { version = "=0.2.191", optional = true }
swoole-rs-inflate = { path = "../inflate", optional = true }
swoole-rs-http2 = { path = "../http2", optional = true }
swoole-rs-hooks = { path = "../hooks", optional = true }
swoole-rs-zend = { path = "../zend", optional = true }
swoole-rs-phpstubs = { path = "../phpstubs", optional = true }
swoole-rs-phphttp = { path = "../phphttp", optional = true }
swoole-rs-phpruntime = { path = "../phpruntime", optional = true }
swoole-rs-reactor = { path = "../reactor", optional = true }
swoole-rs-corebase = { path = "../corebase", optional = true }
swoole-rs-error = { path = "../error", optional = true }
swoole-rs-framing = { path = "../framing", optional = true }
swoole-rs-phpcoroutines = { path = "../phpcoroutines", optional = true }
swoole-rs-phpserver = { path = "../phpserver", optional = true }
swoole-rs-server = { path = "../server", optional = true }
swoole-rs-ports = { path = "../ports", optional = true }
swoole-rs-phpswoole = { path = "../phpswoole", optional = true }
swoole-rs-phpclients = { path = "../phpclients", optional = true }

[lints]
workspace = true
