[package]
name = "swoole-rs-phpevents"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "PHP Swoole\\Event over the reactor"

[lib]
name = "swoole_rs_phpevents"
crate-type = ["rlib"]

[features]
# Needs PHP headers (swoole-rs-zend-sys); without it the crate is empty.
php = ["dep:swoole-rs-zend", "swoole-rs-zend/php", "dep:swoole-rs-phpstubs", "swoole-rs-phpstubs/php", "dep:swoole-rs-corebase", "dep:swoole-rs-memory",
       "dep:swoole-rs-phpswoole", "swoole-rs-phpswoole/php", "dep:swoole-rs-phpcoroutines", "swoole-rs-phpcoroutines/php", "dep:swoole-rs-phptimer", "swoole-rs-phptimer/php",
       "dep:swoole-rs-reactor", "swoole-rs-reactor/upstream-symbols", "dep:swoole-rs-process", "swoole-rs-process/upstream-symbols", "dep:swoole-rs-tls", "dep:swoole-rs-phpprocess", "swoole-rs-phpprocess/php"]

[dependencies]
swoole-rs-corebase = { path = "../corebase", optional = true }
swoole-rs-memory = { path = "../memory", optional = true }
swoole-rs-phpcoroutines = { path = "../phpcoroutines", optional = true }
swoole-rs-phpswoole = { path = "../phpswoole", optional = true }
swoole-rs-phpprocess = { path = "../phpprocess", optional = true }
swoole-rs-phptimer = { path = "../phptimer", optional = true }
swoole-rs-process = { path = "../process", optional = true }
swoole-rs-reactor = { path = "../reactor", optional = true }
swoole-rs-tls = { path = "../tls", optional = true }
swoole-rs-zend = { path = "../zend", optional = true }
swoole-rs-phpstubs = { path = "../phpstubs", optional = true }

[lints]
workspace = true
