[package]
name = "swoole-rs-crc32"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
name = "swoole_rs_crc32"
crate-type = ["rlib"]

[features]
# Export `swoole_crc32` under its mangled C++ name.
upstream-symbols = []

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
swoole-rs-oracle = { path = "../oracle" }

[lints]
workspace = true
