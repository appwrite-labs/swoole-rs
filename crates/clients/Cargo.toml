[package]
name = "swoole-rs-clients"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true

[lib]
name = "swoole_rs_clients"
crate-type = ["rlib"]

[features]
cares = ["dep:swoole-rs-cares-sys", "swoole-rs-cares-sys/libcares"]

[dependencies]
swoole-rs-cares-sys = { path = "../cares-sys", optional = true }
swoole-rs-error = { path = "../error" }
swoole-rs-corebase = { path = "../corebase" }
swoole-rs-base64 = { path = "../base64" }
swoole-rs-websocket = { path = "../websocket" }
swoole-rs-reactor = { path = "../reactor" }
swoole-rs-buffer = { path = "../buffer" }
swoole-rs-http-ffi = { path = "../http-ffi" }
swoole-rs-protocols = { path = "../protocols" }
swoole-rs-coroutine = { path = "../coroutine" }
swoole-rs-tls = { path = "../tls" }
swoole-rs-timer = { path = "../timer", features = ["upstream-symbols"] }
libc = "=0.2.191"

[dev-dependencies]
# The real timer pulls in reactor signal cleanup through this existing TLS export.
swoole-rs-tls = { path = "../tls", features = ["upstream-symbols"] }
swoole-rs-oracle = { path = "../oracle" }

# The request formatter against the pinned calls (tests/modules/clients/README.md).
[[test]]
name = "http_format"
path = "../../tests/modules/clients/http_format.rs"

# The SOCKS5 proxy, MQTT length callback and RESP receive loop against the pinned
# bodies (tests/modules/protocols/README.md).
[[test]]
name = "native"
path = "../../tests/modules/protocols/native.rs"

[lints]
workspace = true
