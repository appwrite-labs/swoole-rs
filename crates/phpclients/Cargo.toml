[package]
name = "swoole-rs-phpclients"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "PHP client classes (Swoole\\Coroutine\\Socket, Swoole\\Coroutine\\Client) over the zend crate"

[features]
# Needs PHP headers (swoole-rs-zend-sys); without it the crate is empty.
php = ["dep:swoole-rs-reactor", "dep:libc", "dep:swoole-rs-error", "dep:swoole-rs-clients", "dep:swoole-rs-hooks", "dep:swoole-rs-tls", "dep:swoole-rs-corebase", "dep:swoole-rs-inflate", "dep:swoole-rs-base64", "dep:swoole-rs-zend", "swoole-rs-zend/php", "dep:swoole-rs-phpstubs", "swoole-rs-phpstubs/php", "dep:swoole-rs-phpruntime", "swoole-rs-phpruntime/php", "dep:swoole-rs-phpswoole", "swoole-rs-phpswoole/php", "dep:swoole-rs-phpcoroutines", "swoole-rs-phpcoroutines/php", "dep:swoole-rs-buffer", "dep:swoole-rs-http", "dep:swoole-rs-http-ffi", "dep:swoole-rs-protocols-ffi", "dep:swoole-rs-ports", "dep:swoole-rs-server", "dep:swoole-rs-websocket-ffi"]

[dependencies]
libc = { version = "=0.2.191", optional = true }
swoole-rs-reactor = { path = "../reactor", optional = true }
swoole-rs-error = { path = "../error", optional = true }
swoole-rs-clients = { path = "../clients", optional = true }
swoole-rs-hooks = { path = "../hooks", optional = true }
swoole-rs-tls = { path = "../tls", optional = true }
swoole-rs-corebase = { path = "../corebase", optional = true }
swoole-rs-inflate = { path = "../inflate", optional = true }
swoole-rs-base64 = { path = "../base64", optional = true }
swoole-rs-zend = { path = "../zend", optional = true }
swoole-rs-phpstubs = { path = "../phpstubs", optional = true }
swoole-rs-phpruntime = { path = "../phpruntime", optional = true }
swoole-rs-phpswoole = { path = "../phpswoole", optional = true }
swoole-rs-phpcoroutines = { path = "../phpcoroutines", optional = true }
swoole-rs-buffer = { path = "../buffer", optional = true }
swoole-rs-http = { path = "../http", optional = true }
swoole-rs-http-ffi = { path = "../http-ffi", optional = true }
swoole-rs-protocols-ffi = { path = "../protocols-ffi", optional = true }
swoole-rs-ports = { path = "../ports", optional = true }
swoole-rs-server = { path = "../server", optional = true }
swoole-rs-websocket-ffi = { path = "../websocket-ffi", optional = true }

[lints]
workspace = true
