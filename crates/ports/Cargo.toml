[package]
name = "swoole-rs-ports"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true

[lib]
name = "swoole_rs_ports"
crate-type = ["rlib"]

[dependencies]
libc = "=0.2.191"
swoole-rs-reactor = { path = "../reactor" }
swoole-rs-server = { path = "../server", features = ["upstream-symbols"] }
swoole-rs-http-ffi = { path = "../http-ffi" }
swoole-rs-corebase = { path = "../corebase" }
swoole-rs-error = { path = "../error" }
swoole-rs-clients = { path = "../clients" }
swoole-rs-tls = { path = "../tls" }
swoole-rs-websocket = { path = "../websocket" }
swoole-rs-locale = { path = "../locale" }
swoole-rs-framing = { path = "../framing" }
swoole-rs-http2 = { path = "../http2" }

[dev-dependencies]
swoole-rs-corebase = { path = "../corebase", features = ["log-capture"] }
swoole-rs-oracle = { path = "../oracle" }
# System::init_reactor, which crates/reactor's swoole_event_init calls.
swoole-rs-hooks = { path = "../hooks", features = ["upstream-symbols"] }

# The former native gates against the pinned catalog and getter (tests/modules/ports/README.md).
[[test]]
name = "catalog"
path = "../../tests/modules/ports/catalog.rs"

[lints]
workspace = true
