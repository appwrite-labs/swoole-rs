[package]
name = "swoole-rs-ports"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
name = "swoole_rs_ports"
crate-type = ["rlib"]

[features]
# Define the upstream C++ symbols of the ListenPort methods `crates/ports/src/methods.rs`
# holds; only the hybrid's archive, whose port.cc no longer defines them, turns it on.
upstream-symbols = []

[dependencies]
swoole-rs-server = { path = "../server" }
swoole-rs-http = { path = "../http" }
swoole-rs-corebase = { path = "../corebase" }
swoole-rs-error = { path = "../error" }

[lints]
workspace = true
