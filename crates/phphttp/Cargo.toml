[package]
name = "swoole-rs-phphttp"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
# cfg(zts): see that script.
build = "../phpcoroutines/build.rs"
description = "PHP Swoole\\Http classes over the zend crates and the httpbindings policy"

[features]
# Needs PHP headers (swoole-rs-zend-sys); without it the crate is empty.
php = ["dep:swoole-rs-zend", "swoole-rs-zend/php", "dep:swoole-rs-httpbindings", "dep:swoole-rs-http", "dep:swoole-rs-deflate", "dep:libc", "dep:swoole-rs-phpstubs", "swoole-rs-phpstubs/php", "dep:swoole-rs-inflate", "dep:swoole-rs-websocket", "dep:swoole-rs-corebase", "dep:swoole-rs-ossupport", "dep:swoole-rs-server", "dep:swoole-rs-ports", "dep:swoole-rs-phpswoole", "swoole-rs-phpswoole/php", "dep:swoole-rs-phpruntime", "swoole-rs-phpruntime/php", "dep:swoole-rs-buffer", "dep:swoole-rs-process", "dep:swoole-rs-http2", "dep:swoole-rs-clients", "dep:swoole-rs-hooks", "dep:swoole-rs-phpclients", "swoole-rs-phpclients/php", "dep:swoole-rs-phphelpers", "swoole-rs-phphelpers/php", "dep:swoole-rs-phpcoroutines", "swoole-rs-phpcoroutines/php", "dep:swoole-rs-phpserver", "swoole-rs-phpserver/php", "swoole-rs-phpserver/server", "dep:swoole-rs-reactor", "dep:swoole-rs-memory", "dep:swoole-rs-tls"]

[dependencies]
libc = { version = "=0.2.191", optional = true }
swoole-rs-buffer = { path = "../buffer", optional = true }
swoole-rs-clients = { path = "../clients", optional = true }
swoole-rs-hooks = { path = "../hooks", optional = true }
swoole-rs-corebase = { path = "../corebase", optional = true }
swoole-rs-memory = { path = "../memory", optional = true }
swoole-rs-deflate = { path = "../deflate", optional = true }
swoole-rs-http = { path = "../http", optional = true }
swoole-rs-http2 = { path = "../http2", optional = true }
swoole-rs-httpbindings = { path = "../httpbindings", optional = true }
swoole-rs-inflate = { path = "../inflate", optional = true }
swoole-rs-ossupport = { path = "../ossupport", optional = true }
swoole-rs-process = { path = "../process", optional = true }
swoole-rs-reactor = { path = "../reactor", optional = true }
swoole-rs-server = { path = "../server", optional = true }
swoole-rs-ports = { path = "../ports", optional = true }
swoole-rs-tls = { path = "../tls", optional = true }
swoole-rs-websocket = { path = "../websocket", optional = true }
swoole-rs-zend = { path = "../zend", optional = true }
swoole-rs-phpstubs = { path = "../phpstubs", optional = true }
swoole-rs-phpruntime = { path = "../phpruntime", optional = true }
swoole-rs-phpswoole = { path = "../phpswoole", optional = true }
swoole-rs-phpclients = { path = "../phpclients", optional = true }
swoole-rs-phphelpers = { path = "../phphelpers", optional = true }
swoole-rs-phpcoroutines = { path = "../phpcoroutines", optional = true }
swoole-rs-phpserver = { path = "../phpserver", optional = true }

[lints]
workspace = true
