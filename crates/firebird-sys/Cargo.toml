[package]
name = "swoole-rs-firebird-sys"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "Declarations of the Firebird client calls pdo_firebird makes (ibase.h, Firebird 3+)"

[features]
# The descriptor layouts and type codes of the system's ibase.h (firebird-dev),
# bindgen'd. Without it the crate declares only the calls, so the workspace
# builds and tests on machines without Firebird's headers.
ibase = ["dep:bindgen"]

[build-dependencies]
bindgen = { version = "=0.73.2", default-features = false, features = ["runtime"], optional = true }

[lints]
workspace = true
