[package]
name = "swoole-rs-server"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
name = "swoole_rs_server"
crate-type = ["rlib"]

[lints]
workspace = true

[features]
# Define the upstream C++ symbols of the methods `crates/server/src/server_methods.rs` holds;
# only the hybrid's archive, whose master.cc no longer defines them, turns it on.
upstream-symbols = []

[dependencies]
libc = "=0.2.191"
swoole-rs-corebase = { path = "../corebase" }
swoole-rs-process = { path = "../process" }
swoole-rs-reactor = { path = "../reactor" }
