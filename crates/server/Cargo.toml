[package]
name = "swoole-rs-server"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
name = "swoole_rs_server"
crate-type = ["rlib"]

[lints]
workspace = true

[features]
# Define the upstream C++ symbols of the methods `crates/server/src/server_methods.rs` holds;
# only the hybrid's archive, whose upstream sources no longer define them, turns it on.
upstream-symbols = ["swoole-rs-tls/upstream-symbols"]
# `--fix-halfclose` (M15, native/halfclose): drain queued output before close and keep a
# synchronous worker's response after a clean FIN.
halfclose = []

[dependencies]
libc = "=0.2.191"
swoole-rs-buffer = { path = "../buffer" }
swoole-rs-clients = { path = "../clients" }
swoole-rs-corebase = { path = "../corebase" }
swoole-rs-crc32 = { path = "../crc32" }
swoole-rs-ossupport = { path = "../ossupport" }
swoole-rs-process = { path = "../process" }
swoole-rs-error = { path = "../error" }
swoole-rs-framing = { path = "../framing" }
swoole-rs-locks = { path = "../locks" }
swoole-rs-memory = { path = "../memory" }
swoole-rs-http = { path = "../http" }
swoole-rs-http-ffi = { path = "../http-ffi" }
swoole-rs-bus = { path = "../bus" }
swoole-rs-reactor = { path = "../reactor" }
swoole-rs-tls = { path = "../tls" }
swoole-rs-timer = { path = "../timer", features = ["upstream-symbols"] }
swoole-rs-utilities = { path = "../utilities" }

[dev-dependencies]
swoole-rs-oracle = { path = "../oracle" }
