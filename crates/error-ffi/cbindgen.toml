language = "C"
include_guard = "SWOOLE_RS_ERROR_H"
cpp_compat = true
usize_is_size_t = true
no_includes = true
sys_includes = ["stdint.h"]
documentation = false
autogen_warning = "/* Generated from crates/error-ffi by cbindgen (tools/headers.sh); do not edit. */"
[parse]
parse_deps = true
include = ["swoole-rs-error"]
[export]
include = ["ErrorCode"]
[export.rename]
"ErrorCode" = "swErrorCode"
"IgnoredErrors" = "SwrErrorIgnored"
[enum]
prefix_with_name = false
