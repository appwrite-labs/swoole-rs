language = "C"
include_guard = "SWOOLE_RS_ERROR_H"
cpp_compat = true
usize_is_size_t = true
no_includes = true
sys_includes = ["stdint.h"]
documentation = false
autogen_warning = "/* Generated from crates/error-ffi by cbindgen (tools/headers.sh); do not edit. */"
[parse]
parse_deps = true
include = ["swoole-rs-error"]
[export]
include = ["ErrorCode"]
# C++ compatibility symbols have their own declarations outside the C ABI.
exclude = [
    "_Z15swoole_strerrori",
    "_Z25swoole_get_last_error_msgv",
    "_Z27swoole_clear_last_error_msgv",
    "_Z18swoole_throw_errori",
    "_Z19swoole_ignore_errori",
    "_Z23swoole_is_ignored_errori",
]
[export.rename]
"ErrorCode" = "swErrorCode"
[enum]
prefix_with_name = false
