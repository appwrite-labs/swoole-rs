# Upstream's core-tests/src/coroutine/{system,hook,socket}.cpp GoogleTests as Rust, linked against the
# hybrid tree's libswoole.so (SWOOLE_LIB_DIR). Not a workspace member: it needs that
# Linux build, which system.py makes.
[package]
name = "swoole-rs-hooks-system-tests"
version = "0.0.0"
edition = "2024"
publish = false

# The reactor and process records' methods, which upstream's Socket and Worker members became.
[dependencies]
swoole-rs-process = { path = "../../../../crates/process" }
swoole-rs-reactor = { path = "../../../../crates/reactor" }

[workspace]
