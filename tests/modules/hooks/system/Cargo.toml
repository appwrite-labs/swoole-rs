# Upstream's core-tests/src/coroutine/{system,hook,socket}.cpp GoogleTests (and the others main.rs lists) as Rust, linked with
# the crates (swoole-rs-ffi) and the C and C++ tests/modules/hooks/system.py builds, which builds
# and runs it (Linux); `cargo test` leaves it out.
[package]
name = "swoole-rs-hooks-system-tests"
version = "0.0.0"
edition = "2024"
publish = false
license.workspace = true
build = "build.rs"

[[bin]]
name = "swoole-rs-hooks-system-tests"
path = "src/main.rs"
test = false

[dependencies]
libc = "=0.2.191"
swoole-rs-clients = { path = "../../../../crates/clients" }
swoole-rs-corebase = { path = "../../../../crates/corebase", features = ["upstream-symbols"] }
swoole-rs-ffi = { path = "../../../../crates/ffi" }
swoole-rs-hooks = { path = "../../../../crates/hooks" }
swoole-rs-memory = { path = "../../../../crates/memory" }
swoole-rs-process = { path = "../../../../crates/process" }
swoole-rs-reactor = { path = "../../../../crates/reactor" }
# The original pool cases now pass the real server effects explicitly.
swoole-rs-server = { path = "../../../../crates/server" }
swoole-rs-timer = { path = "../../../../crates/timer", features = ["upstream-symbols"] }
swoole-rs-tls = { path = "../../../../crates/tls" }

[lints]
workspace = true
