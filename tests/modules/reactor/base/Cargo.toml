# Upstream's core-tests/src/reactor/base.cpp TESTs as Rust, linked against system.py's
# libswoole.so (SWOOLE_LIB_DIR) with fixture.cc compiled in. Not a workspace member: it needs that
# Linux build, which tests/modules/hooks/system.py makes. build.rs links it; Cargo.lock pins the
# (empty) dependency set for --locked.
[package]
name = "swoole-rs-reactor-base-tests"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]
