# Upstream's core-tests/src/reactor/base.cpp TESTs as Rust over the crates (swoole-rs-ffi),
# linked with the C and C++ tests/modules/hooks/system.py builds, which builds and runs it
# (Linux); `cargo test` leaves it out.
[package]
name = "swoole-rs-reactor-base-tests"
version = "0.0.0"
edition = "2024"
publish = false
license.workspace = true
build = "../../hooks/system/build.rs"

[[bin]]
name = "swoole-rs-reactor-base-tests"
path = "src/main.rs"
test = false

[dependencies]
swoole-rs-ffi = { path = "../../../../crates/ffi" }

[lints]
workspace = true
