name: io_uring
# Upstream and the Cargo-built swoole.so with --enable-iouring --enable-uring-socket,
# then the original PHPTs upstream's own io_uring CI runs (scripts/run-tests.sh with
# SWOOLE_IOURING), plus the families whose code paths io_uring replaces (System::sleep,
# waitpid, coroutine locks). Any test that passes on upstream must pass on the Cargo build.
# Called by the merge tier, and by the PR tier when a PR touches io_uring code.
on:
  workflow_call:
defaults:
  run:
    shell: bash

jobs:
  phpt:
    runs-on: gcrunner=${{ github.run_id }}/runner=standard
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - id: install
        uses: ./.github/actions/install
      - id: upstream
        uses: ./.github/actions/upstream
        with:
          args: --configure=--enable-iouring --configure=--enable-uring-socket
          php: ${{ steps.install.outputs.php }}
      - run: cargo fetch --locked
      # The control is the pinned reference itself, unpatched.
      - run: |
          python3 tools/build_ext.py --configure=--enable-iouring --configure=--enable-uring-socket
          mkdir -p target/phpt
          cp ${{ steps.upstream.outputs.library }} target/phpt/upstream.so
          cp target/ext/swoole.so target/phpt/cargo.so
          for engine in upstream cargo; do php -n -d extension=$PWD/target/phpt/$engine.so --ri swoole | grep -E 'io_uring|uring_socket'; done
          python3 corpus/upstream/inventory.py --output target/phpt/manifest.json
      # Every swr_v* this build's config.h declares (SW_USE_URING_SOCKET's too) is exported.
      - name: ABI export gate
        timeout-minutes: 5
        run: >
          python3 tests/modules/integration/test_bridge.py --startup-only --php-extension sockets
          --extension target/ext/swoole.so --reference target/phpt/upstream.so
      # On a PR, upstream's report comes from main's latest run of this job while nothing it
      # depends on has changed since (tools/ci.py phpt-baseline); the merge tier runs both engines.
      - if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: corpus/upstream/baseline.sh iouring
      - id: extensions
        run: echo "args=$(sed -n 's/^extension=\(.*\)/--php-extension \1/p' /etc/php/*/cli/conf.d/*.ini | sed 's/\.so$//' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      - run: |
          families="--module swoole_iouring --module swoole_runtime --module swoole_coroutine_lock --module swoole_coroutine_system"
          mkdir -p target/phpt/iouring
          for engine in upstream cargo; do
            [ ! -f target/phpt/iouring/$engine.json ] || continue  # the baseline's
            python3 corpus/upstream/run.py --manifest target/phpt/manifest.json $families --timeout 30 \
              ${{ steps.extensions.outputs.args }} --engine $engine=target/phpt/$engine.so \
              --output target/phpt/iouring/$engine.json || [ $? -eq 1 ]
          done
          corpus/upstream/recheck.sh target/phpt/iouring target/phpt target/phpt/recheck \
            --manifest target/phpt/manifest.json --timeout 30 ${{ steps.extensions.outputs.args }}
          set -- target/phpt/iouring/*.json
          if ls target/phpt/recheck/*.json >/dev/null 2>&1; then set -- "$@" --recheck target/phpt/recheck/*.json; fi
          python3 corpus/upstream/gate.py "$@" --output phpt-iouring.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phpt-iouring
          path: |
            phpt-iouring.json
            target/phpt/iouring/
            target/phpt/recheck/
