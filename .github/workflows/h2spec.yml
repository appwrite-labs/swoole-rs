name: h2spec
# HTTP/2 conformance (tests/modules/http2/h2spec.py): the pinned h2spec, strict cases
# included, against an open_http2_protocol server over h2c and TLS on upstream and the
# Cargo-built swoole.so. A case that passes on upstream must pass on the Cargo build;
# upstream's own failures are listed in the summary and report.
# Called by the merge tier, and by the PR tier when a PR touches HTTP/2 code.
on:
  workflow_call:
env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 500M
defaults:
  run:
    shell: bash

jobs:
  h2spec:
    runs-on: ${{ (github.event_name != 'pull_request' && github.event_name != 'workflow_run' || github.event.pull_request.head.repo.full_name == github.repository || github.event.workflow_run.head_repository.full_name == github.repository) && format(vars.RUNNER || 'ubuntu-24.04', github.run_id, strategy.job-index) || 'ubuntu-24.04' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: false
      - run: rm -rf target/ext target/thirdparty target/native-core
      - uses: ./.github/actions/install
      - uses: actions/cache/restore@v4
        with:
          path: target/upstream
          key: upstream-${{ runner.os }}-${{ hashFiles('tools/build_upstream.py') }}
      - if: hashFiles('target/upstream/src/modules/swoole.so') == ''
        run: python3 tools/build_upstream.py
      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-
      - run: cargo fetch --locked
      - run: python3 tools/build_ext.py
      - run: >
          python3 tests/modules/http2/h2spec.py --engine upstream=target/upstream/src/modules/swoole.so
          --engine cargo=target/ext/swoole.so --output target/reports/h2spec.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h2spec
          path: |
            target/reports/h2spec.json
            target/reports/h2spec-logs/
