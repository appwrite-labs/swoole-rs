name: Sanitizers
# The Cargo-built swoole.so under ASan and UBSan, with every module gate and crate unit test
# (the application corpus among them) and the PHPT selection (tools/asan.py). Nightly, and from the PR tier when a PR touches this run. A
# report from code this repository builds fails the run; rerun tools/asan.py locally to read it
# and file it as a p0 kind:bug. Upstream's reference build is only counted; its reports go to
# the private security repository. Reports are never uploaded here.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  workflow_call:
defaults:
  run:
    shell: bash

jobs:
  asan:
    runs-on: gcrunner=${{ github.run_id }}/runner=build
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # Gates compare against accepted patch states at older commits.
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install
        with:
          packages: clang libclang-rt-dev llvm
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: target/upstream
          key: upstream-${{ runner.os }}-${{ hashFiles('tools/build_upstream.py') }}-${{ github.workspace }}
      - name: Build upstream
        run: test -f target/upstream/src/run-tests.php || python3 tools/build_upstream.py
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: target/asan/php
          key: php-asan-${{ runner.os }}-${{ hashFiles('.devcontainer/php.sh', 'tools/asan.py', 'tools/asan_case.c') }}-${{ github.workspace }}
      - name: Fetch crates
        run: cargo fetch --locked
      - name: Prepare hyperf
        run: python3 corpus/thirdparty/hyperf.py --prepare
      - name: Run ASan lanes
        run: python3 tools/asan.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          retention-days: ${{ github.ref != 'refs/heads/main' && 1 || 0 }}
          name: asan
          path: |
            target/asan/*.json
            target/reports/dev/*/loop.json
            target/reports/dev/*/reference-build.log
            target/upstream/build.log
