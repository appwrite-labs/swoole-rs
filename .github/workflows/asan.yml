name: Sanitizers
# The all-modules hybrid under ASan and UBSan, with every module gate and crate unit test
# (the application corpus among them) and the PHPT selection (tools/asan.py). Nightly, and from the PR tier when a PR touches this run. Any
# sanitizer report fails the run; rerun tools/asan.py locally to read it and file it as a
# p0 kind:bug, or privately if upstream code is at fault. Reports are never uploaded here.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  workflow_call:
env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 500M
defaults:
  run:
    shell: bash

jobs:
  asan:
    runs-on: ${{ (github.event_name != 'pull_request' && github.event_name != 'workflow_run' || github.event.pull_request.head.repo.full_name == github.repository || github.event.workflow_run.head_repository.full_name == github.repository) && format(vars.RUNNER || 'ubuntu-24.04', github.run_id, strategy.job-index) || 'ubuntu-24.04' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        # Gates compare against accepted patch states at older commits.
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install
        with:
          packages: clang libclang-rt-dev llvm
      - uses: actions/cache/restore@v4
        with:
          path: target/upstream
          key: upstream-${{ runner.os }}-${{ hashFiles('tools/build_upstream.py') }}
      - run: test -f target/upstream/src/run-tests.php || python3 tools/build_upstream.py
      - uses: actions/cache@v4
        with:
          path: target/asan/php
          key: php-asan-${{ runner.os }}-${{ hashFiles('.devcontainer/php.sh', 'tools/asan.py') }}
      # Sanitized objects never hit the shared ccache (other flags), so this run keeps its own.
      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-asan-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-asan-${{ runner.os }}-
      - run: cargo fetch --locked
      - run: python3 corpus/thirdparty/hyperf.py --prepare
      - run: python3 tools/asan.py
      - if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-asan-${{ runner.os }}-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asan
          path: |
            target/asan/*.json
            target/reports/dev/*/loop.json
