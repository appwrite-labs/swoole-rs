name: ClusterFuzzLite PR
on:
  pull_request:
    # The crates fuzz/'s targets link (cargo metadata on fuzz/Cargo.toml); the nightly batch
    # covers whatever drifts out of this list.
    paths:
      - 'crates/base64/**'
      - 'crates/buffer/**'
      - 'crates/clients/**'
      - 'crates/corebase/**'
      - 'crates/coroutine/**'
      - 'crates/crc32/**'
      - 'crates/error/**'
      - 'crates/framing/**'
      - 'crates/http-ffi/**'
      - 'crates/http/**'
      - 'crates/http2/**'
      - 'crates/locale/**'
      - 'crates/locks/**'
      - 'crates/memory/**'
      - 'crates/oracle/**'
      - 'crates/ossupport/**'
      - 'crates/process/**'
      - 'crates/protocols-ffi/**'
      - 'crates/protocols/**'
      - 'crates/reactor/**'
      - 'crates/timer/**'
      - 'crates/tls/**'
      - 'crates/utilities/**'
      - 'crates/websocket/**'
      - 'fuzz/**'
      - '.clusterfuzzlite/**'
      - 'Cargo.lock'
permissions: read-all
concurrency:
  group: cflite-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  # Fuzzes the targets a PR's change reaches for two minutes, starting from the
  # corpus the nightly batch run keeps. A crash fails the job and is uploaded.
  fuzz:
    runs-on: gcrunner=${{ github.run_id }}/runner=standard
    timeout-minutes: 15
    steps:
      - id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@v1
        with:
          language: rust
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: address
      - id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 120
          mode: code-change
          sanitizer: address
          minimize-crashes: true
      - if: failure() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: cflite-crashes
          path: ./out/artifacts
