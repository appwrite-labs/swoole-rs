name: ClusterFuzzLite PR
on:
  pull_request:
    # The crates fuzz/'s targets link (cargo metadata on fuzz/Cargo.toml); the nightly batch
    # covers whatever drifts out of this list.
    paths:
      - 'crates/base64/**'
      - 'crates/brotli/**'
      - 'crates/buffer/**'
      - 'crates/clients/**'
      - 'crates/corebase/**'
      - 'crates/coroutine/**'
      - 'crates/crc32/**'
      - 'crates/deflate/**'
      - 'crates/error/**'
      - 'crates/error-ffi/**'
      - 'crates/framing/**'
      - 'crates/http-ffi/**'
      - 'crates/http/**'
      - 'crates/http2/**'
      - 'crates/inflate/**'
      - 'crates/locale/**'
      - 'crates/locks/**'
      - 'crates/memory/**'
      - 'crates/oracle/**'
      - 'crates/ossupport/**'
      - 'crates/process/**'
      - 'crates/protocols-ffi/**'
      - 'crates/protocols/**'
      - 'crates/reactor/**'
      - 'crates/timer/**'
      - 'crates/tls/**'
      - 'crates/utilities/**'
      - 'crates/websocket/**'
      - 'crates/zlib/**'
      - 'fuzz/**'
      - '.clusterfuzzlite/**'
      - '.github/workflows/cflite_pr.yml'
      - 'Cargo.lock'
permissions: read-all
concurrency:
  group: cflite-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  # Fuzzes the targets a PR's change reaches for two minutes, starting from the
  # corpus the nightly batch run keeps. A crash fails the job and is uploaded.
  fuzz:
    runs-on: gcrunner=${{ github.run_id }}/runner=standard
    timeout-minutes: 20
    steps:
      # No github-token in either step: with one, ClusterFuzzLite finds a coverage report and
      # each target's corpus by paging through every Actions artifact of the repository, 552
      # API calls a target at 55k artifacts, which spent the hourly limit every CI job shares
      # (#3081, #3257). The corpus comes over git from the cflite branch (cflite_batch.yml).
      - id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@v1
        with:
          language: rust
          sanitizer: address
      - id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@v1
        with:
          storage-repo: ${{ github.server_url }}/${{ github.repository }}.git
          storage-repo-branch: cflite
          fuzz-seconds: 120
          mode: code-change
          sanitizer: address
          minimize-crashes: true
      - if: failure() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          retention-days: ${{ github.ref != 'refs/heads/main' && 1 || 0 }}
          name: cflite-crashes
          path: ./out/artifacts
