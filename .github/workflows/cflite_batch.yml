name: ClusterFuzzLite batch
on:
  schedule:
    - cron: '0 3 * * *'
    - cron: '0 6 * * *'
  workflow_dispatch:
permissions: read-all
jobs:
  # Nightly: an hour across every fuzz/ target, growing ClusterFuzzLite's stored
  # corpus. The second schedule prunes that corpus. Crashes fail the job.
  fuzz:
    runs-on: gcrunner=${{ github.run_id }}/runner=standard
    steps:
      - id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@v1
        with:
          language: rust
          sanitizer: address
      - id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: ${{ github.event.schedule == '0 6 * * *' && 600 || 3600 }}
          mode: ${{ github.event.schedule == '0 6 * * *' && 'prune' || 'batch' }}
          sanitizer: address
          minimize-crashes: true
      - if: failure() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: cflite-crashes
          path: ./out/artifacts
  # A failed batch on main otherwise reaches nobody: open one ready bug for it.
  report:
    needs: fuzz
    if: failure()
    runs-on: gcrunner=${{ github.run_id }}/runner=small
    permissions:
      issues: write
    steps:
      - name: File batch failure
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='ClusterFuzzLite batch failed'
          if [ -z "$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[].number')" ]; then
            gh issue create --title "$title" --label kind:bug,p1,status:ready --assignee loks0n \
              --body "$RUN failed. Download its \`cflite-crashes\` artifact, reproduce each crash with \`cargo +nightly fuzz run <target> <input> -- -runs=1\`, fix it, and add the input to \`fuzz/seeds/<target>/\`. If the crash is a likely upstream vulnerability, file it in the private security repository instead of here."
          fi
