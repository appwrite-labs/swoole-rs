name: thread-context
# Upstream and the Cargo-built swoole.so with --enable-thread-context (each
# coroutine on its own thread, crates/coroutine/src/thread.rs), then the coroutine
# PHPT families. Any test that passes on upstream must pass on the Cargo build.
# Called by the merge tier, and by the PR tier when a PR touches the coroutine
# context or the coroutine state the loop thread shares with coroutine threads.
on:
  workflow_call:
env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 500M
defaults:
  run:
    shell: bash

jobs:
  phpt:
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install
      # Restored only: the pinned reference is rebuilt with thread context below, never saved.
      - uses: actions/cache/restore@v4
        with:
          path: target/upstream
          key: upstream-${{ runner.os }}-${{ hashFiles('tools/build_upstream.py') }}
      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-
      - run: cargo fetch --locked
      # The control is the pinned reference itself, unpatched.
      - run: |
          python3 tools/build_upstream.py --configure=--enable-thread-context
          python3 tools/build_ext.py --configure=--enable-thread-context
          mkdir -p target/phpt
          cp -L target/upstream/src/modules/swoole.so target/phpt/upstream.so
          cp target/ext/swoole.so target/phpt/cargo.so
          for engine in upstream cargo; do php -n -d extension=$PWD/target/phpt/$engine.so --ri swoole | grep 'thread context'; done
          python3 corpus/upstream/inventory.py --output target/phpt/manifest.json
      - id: extensions
        run: echo "args=$(sed -n 's/^extension=\(.*\)/--php-extension \1/p' /etc/php/*/cli/conf.d/*.ini | sed 's/\.so$//' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      - run: |
          families="--module swoole_coroutine --module swoole_channel_coro --module swoole_coroutine_scheduler --module swoole_coroutine_system"
          mkdir -p target/phpt/threadcontext
          for engine in upstream cargo; do
            python3 corpus/upstream/run.py --manifest target/phpt/manifest.json $families --timeout 30 \
              ${{ steps.extensions.outputs.args }} --engine $engine=target/phpt/$engine.so \
              --output target/phpt/threadcontext/$engine.json || [ $? -eq 1 ]
          done
          corpus/upstream/recheck.sh target/phpt/threadcontext target/phpt target/phpt/recheck \
            --manifest target/phpt/manifest.json --timeout 30 ${{ steps.extensions.outputs.args }}
          set -- target/phpt/threadcontext/*.json
          if ls target/phpt/recheck/*.json >/dev/null 2>&1; then set -- "$@" --recheck target/phpt/recheck/*.json; fi
          python3 corpus/upstream/gate.py "$@" --output phpt-threadcontext.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phpt-threadcontext
          path: |
            phpt-threadcontext.json
            target/phpt/threadcontext/
            target/phpt/recheck/
