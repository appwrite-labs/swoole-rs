name: PR
on:
  pull_request:
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
# Explicit bash runs steps with -eo pipefail; the default (`bash -e`) lets a pipe
# like `gate.py | tee` report success when gate.py fails.
defaults:
  run:
    shell: bash

jobs:
  rust:
    runs-on: gcrunner=${{ github.run_id }}/runner=build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # PHP headers and libclang: zend-sys binds them under the `php` feature,
      # which --all-features turns on (every module crate, as in crates/ext).
      - uses: ./.github/actions/install
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - uses: taiki-e/install-action@v2
        with:
          tool: cbindgen@0.29.4,cargo-deny@0.18.9,cargo-machete@0.9.1
      - run: tools/headers.sh --check
      # Dependencies: advisories, licences, bans (no async runtime) and sources (deny.toml); unused ones.
      - run: cargo deny check
      - run: cargo machete

  tooling:
    runs-on: gcrunner=${{ github.run_id }}/runner=standard
    timeout-minutes: 10
    steps:
      # Two commits: the PR's merge commit and, as HEAD^1, main, which tools/budget.py compares against.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: python3 tools/check_migration.py
      # No crate's unsafe or slow-layout count may rise above main's.
      - run: python3 tools/budget.py --base HEAD^1
      - run: tests/dev/run.sh

  # Whether this PR touches what the extension build compiles or installs with.
  changes:
    runs-on: gcrunner=${{ github.run_id }}/runner=small
    timeout-minutes: 5
    outputs:
      ext: ${{ steps.paths.outputs.ext }}
      iouring: ${{ steps.paths.outputs.iouring }}
      cares: ${{ steps.paths.outputs.cares }}
      zts: ${{ steps.paths.outputs.zts }}
      threadcontext: ${{ steps.paths.outputs.threadcontext }}
      h2spec: ${{ steps.paths.outputs.h2spec }}
      asan: ${{ steps.paths.outputs.asan }}
      tsan: ${{ steps.paths.outputs.tsan }}
      families: ${{ steps.phpt.outputs.families }}
      engines: ${{ steps.phpt.outputs.engines }}
      baseline: ${{ steps.phpt.outputs.baseline }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The PHPT families of the modules this PR touches (every family for shared build
      # inputs), and main's merge-tier run whose upstream results gate them. Every family
      # and upstream run here when this PR changes what upstream's results depend on
      # (tools/ci.py BASELINES).
      - id: phpt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          families=$(python3 -c "
          import subprocess
          from tools.ci import BASELINES, UPSTREAM_KEY
          from tools.dev import MODULES, changed_modules, phpt_families
          base = 'origin/${{ github.base_ref }}'
          modules = changed_modules(base, consumers=False)
          # A PR that changes how the PHPTs are built or run (what a baseline depends on) runs them all.
          runner = subprocess.check_output(['git', 'diff', '--name-only', base + '...HEAD', '--',
                                            'corpus/upstream/', *UPSTREAM_KEY, *BASELINES['phpt'][4]], text=True)
          print('all' if runner or modules == sorted(MODULES) else ' '.join(phpt_families(modules)))")
          echo "families=$families" >> "$GITHUB_OUTPUT"
          read -r run _ <<< "$(python3 tools/ci.py phpt-baseline || true)"
          if [ -n "$run" ]; then
            echo "baseline=$run" >> "$GITHUB_OUTPUT"
            echo 'engines=["cargo"]' >> "$GITHUB_OUTPUT"
          else
            echo 'engines=["upstream", "cargo"]' >> "$GITHUB_OUTPUT"
          fi
      - id: paths
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "$changed"
          if echo "$changed" | grep -qE '^(native/|tools/(build_(upstream|ext)|arginfo)\.py$|crates/(phpstubs|ext)/|\.github/|\.devcontainer/)'; then
            echo ext=true >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -qE '^(native/hooks/|crates/(hooks|uring[^/]*)/|\.github/workflows/iouring\.yml$|\.devcontainer/install\.sh$)'; then
            echo iouring=true >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -qE '^(crates/(clients|corebase|cares-sys)/|\.github/workflows/cares\.yml$)'; then
            echo cares=true >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -qE '^(crates/(phplocks|phpthread|phpstubs|zend[^/]*)/|crates/(corebase|process|server|phpserver)/src/([^/]+/)*thread[^/]*\.rs$|native/(locks|phpthread)/|\.github/workflows/zts\.yml$|\.devcontainer/(install|php)\.sh$)'; then
            echo zts=true >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -qE '^(native/(coroutine|phpcoroutines)/|crates/(coroutine|phpcoroutines|phpcollections|process)/|\.github/workflows/threadcontext\.yml$)'; then
            echo threadcontext=true >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -qE '^(crates/(http2|phphttp2)/|tests/modules/http2/h2spec\.|\.github/workflows/h2spec\.yml$)'; then
            echo h2spec=true >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -qE '^(tools/asan\.py|tools/lsan\.supp|\.github/workflows/asan\.yml|\.devcontainer/php\.sh)$'; then
            echo asan=true >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -qE '^(tools/(tsan\.py|tsan\.supp|tsan_canary\.rs)|\.github/workflows/tsan\.yml|\.devcontainer/php\.sh)$'; then
            echo tsan=true >> "$GITHUB_OUTPUT"
          fi

  # The Cargo-built swoole.so with every module, the halfclose repair and the cURL and
  # ssh2 hooks, so no module's native code merges without being compiled into the
  # extension next to the others. Blocking (via `required`); a PR that touches none of
  # `changes`' paths skips it, which counts as passing.
  ext:
    needs: changes
    if: needs.changes.outputs.ext == 'true'
    runs-on: gcrunner=${{ github.run_id }}/runner=build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install
      # Restores main's release build; the upstream tree must start clean.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: false
      - run: rm -rf target/ext target/upstream target/thirdparty target/native-core
      - id: upstream
        uses: actions/cache/restore@v4
        with:
          path: target/upstream
          key: upstream-${{ runner.os }}-${{ hashFiles('tools/build_upstream.py') }}
      - if: steps.upstream.outputs.cache-hit != 'true'
        run: python3 tools/build_upstream.py
      # crates/phpstubs is current, and says what the pin's gen_stub.php headers say.
      - run: python3 tools/arginfo.py --check
      - run: cargo fetch --locked
      # With the optional cURL and ssh2 hooks (the merge tier's phpt-build runs their PHPTs).
      - run: python3 tools/build_ext.py --fix-halfclose --configure=--enable-swoole-curl --configure=--with-swoole-ssh2
      # Compare SDK alias defaults independently of remote SSH service availability.
      - run: |
          cargo build --locked --release -p swoole-rs-ffi --features ssh2
          python3 tests/modules/hooks/ssh2_aliases.py --source target/upstream/src --archive target/release/libswoole_rs_ffi.a --output target/reports/ssh2-aliases.json
      # Exercise SNI's deferred port resolution on the production extension before merging.
      - run: >
          python3 corpus/upstream/run.py
          --manifest tests/modules/ports/sni-originals.json
          --php-extension curl --php-extension sockets --require-all --isolate-cases
          --engine cargo=target/ext/swoole.so
          --output target/reports/ports-sni-originals.json
      # 12-hyperf needs composer; it runs in the merge tier.
      - run: >
          python3 corpus/run.py
          --php-extension pdo --php-extension pdo_sqlite --php-extension curl
          --project 01-hello --project 02-router --project 03-notes --project 04-job-service
          --project 05-coroutines --project 06-websocket --project 07-tcp-framing
          --project 08-timers --project 09-shared-table --project 10-task-workers
          --engine cargo=target/ext/swoole.so
          --engine upstream=target/upstream/src/modules/swoole.so
          --output target/reports/corpus.json
      # Upstream truncates queued responses after a client half-close; --fix-halfclose repairs it.
      # The native cURL hook links ext/curl, so it loads first.
      - run: >
          python3 corpus/run.py --php-extension curl --project 11-buffer-lifecycle
          --engine cargo=target/ext/swoole.so
          --output target/reports/corpus-halfclose.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-reports
          path: target/reports/

  # The io_uring build variant (merge tier), when a PR touches io_uring code. Informative.
  iouring:
    needs: changes
    if: needs.changes.outputs.iouring == 'true'
    uses: ./.github/workflows/iouring.yml
    # Reads main's merge-tier runs for upstream's report (corpus/upstream/baseline.sh).
    permissions:
      contents: read
      actions: read

  # The c-ares build variant (merge tier), when a PR touches resolver code. Informative.
  cares:
    needs: changes
    if: needs.changes.outputs.cares == 'true'
    uses: ./.github/workflows/cares.yml
    # Reads main's merge-tier runs for upstream's report (corpus/upstream/baseline.sh).
    permissions:
      contents: read
      actions: read

  # The ZTS build variant (merge tier), when a PR touches thread or ZTS code. Informative.
  zts:
    needs: changes
    if: needs.changes.outputs.zts == 'true'
    uses: ./.github/workflows/zts.yml
    # Reads main's merge-tier runs for upstream's report (corpus/upstream/baseline.sh).
    permissions:
      contents: read
      actions: read

  # The thread-context build variant (merge tier), when a PR touches the coroutine context. Informative.
  threadcontext:
    needs: changes
    if: needs.changes.outputs.threadcontext == 'true'
    uses: ./.github/workflows/threadcontext.yml
    # Reads main's merge-tier runs for upstream's report (corpus/upstream/baseline.sh).
    permissions:
      contents: read
      actions: read

  # HTTP/2 conformance (merge tier), when a PR touches HTTP/2 code. Informative.
  h2spec:
    needs: changes
    if: needs.changes.outputs.h2spec == 'true'
    uses: ./.github/workflows/h2spec.yml

  # The sanitizer run (nightly), when a PR touches it. Informative.
  asan:
    needs: changes
    if: needs.changes.outputs.asan == 'true'
    uses: ./.github/workflows/asan.yml

  # The ThreadSanitizer run (nightly), when a PR touches it. Informative.
  tsan:
    needs: changes
    if: needs.changes.outputs.tsan == 'true'
    uses: ./.github/workflows/tsan.yml

  # Candidate-lane gates of the modules this PR touches, and of those whose packages
  # depend on a touched crate (every module for shared build inputs). It fails only on
  # a phase that didn't fail in main's latest completed merge-tier run: red main
  # doesn't block a PR, a new failure does. The PHPT families run in the phpt job.
  gates:
    runs-on: gcrunner=${{ github.run_id }}/runner=build
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: touched
        run: python3 -c "from tools.dev import changed_modules; print('modules=' + ' '.join(changed_modules('origin/${{ github.base_ref }}')))" >> "$GITHUB_OUTPUT"
      - if: steps.touched.outputs.modules != ''
        uses: ./.github/actions/install
      - if: steps.touched.outputs.modules != ''
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: false
      - if: steps.touched.outputs.modules != ''
        run: rm -rf target/upstream target/thirdparty target/native-core
      - if: steps.touched.outputs.modules != ''
        id: upstream
        uses: actions/cache/restore@v4
        with:
          path: target/upstream
          key: upstream-${{ runner.os }}-${{ hashFiles('tools/build_upstream.py') }}
      - if: steps.touched.outputs.modules != '' && steps.upstream.outputs.cache-hit != 'true'
        run: python3 tools/build_upstream.py
      - if: steps.touched.outputs.modules != ''
        run: cargo fetch --locked
      - if: steps.touched.outputs.modules != ''
        id: candidate
        continue-on-error: true
        run: >
          python3 tools/dev.py candidate --changed-since origin/${{ github.base_ref }} --skip-phase phpt
          --php-extension pdo --php-extension pdo_sqlite --php-extension curl --php-extension sockets --php-extension tokenizer --php-extension ffi
      - if: steps.candidate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci.py new-failures target/reports/dev/*/loop.json
      - uses: actions/upload-artifact@v4
        if: always() && steps.touched.outputs.modules != ''
        with:
          name: gates-reports
          path: target/reports/

  # The PHPT families of the modules this PR touches on the Cargo build, sharded with the
  # services they expect and gated on upstream (.github/workflows/phpt.yml).
  phpt-build:
    needs: changes
    if: needs.changes.outputs.families != ''
    runs-on: gcrunner=${{ github.run_id }}/runner=build
    timeout-minutes: 30
    outputs:
      php: ${{ steps.build.outputs.php }}
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - id: build
        uses: ./.github/actions/phpt-build
        with:
          engines: ${{ join(fromJSON(needs.changes.outputs.engines), ' ') }}
      # Each shard pays about 2 minutes of setup: one per 150 of the families' tests, up to 6.
      # inventory.py reads the pin's tests from target/upstream, cloning it when upstream wasn't built.
      - id: shards
        env:
          FAMILIES: ${{ needs.changes.outputs.families != 'all' && needs.changes.outputs.families || '' }}
        run: |
          modules=()
          for family in $FAMILIES; do modules+=(--module "$family"); done
          echo "shards=$(python3 corpus/upstream/inventory.py --plan "${modules[@]}")" >> "$GITHUB_OUTPUT"

  phpt:
    needs: [changes, phpt-build]
    if: needs.changes.outputs.families != ''
    uses: ./.github/workflows/phpt.yml
    permissions:
      contents: read
      actions: read
    with:
      php: ${{ needs.phpt-build.outputs.php }}
      engines: ${{ needs.changes.outputs.engines }}
      families: ${{ needs.changes.outputs.families != 'all' && needs.changes.outputs.families || '' }}
      baseline: ${{ needs.changes.outputs.baseline }}
      shards: ${{ needs.phpt-build.outputs.shards }}

  # The one check main's ruleset requires: every blocking job passed or was skipped.
  # A skipped reusable-workflow caller reports no check at all, so the ruleset can't
  # name those jobs directly. cares, asan and tsan stay informative.
  required:
    if: always()
    needs: [rust, tooling, changes, ext, gates, phpt-build, phpt, iouring, zts, threadcontext]
    runs-on: gcrunner=${{ github.run_id }}/runner=small
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'map_values(.result) | debug | all(. == "success" or . == "skipped")' <<< "$NEEDS"
