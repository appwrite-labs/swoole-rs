name: PR
on:
  pull_request:
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 500M
# Explicit bash runs steps with -eo pipefail; the default (`bash -e`) lets a pipe
# like `gate.py | tee` report success when gate.py fails.
defaults:
  run:
    shell: bash

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # PHP headers and libclang: zend-sys binds them under the `php` feature,
      # which --all-features turns on (every module crate, as in the hybrid).
      - uses: ./.github/actions/install
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - uses: taiki-e/install-action@v2
        with:
          tool: cbindgen@0.29.4,cargo-deny@0.18.9,cargo-machete@0.9.1
      - run: tools/headers.sh --check
      # Dependencies: advisories, licences, bans (no async runtime) and sources (deny.toml); unused ones.
      - run: cargo deny check
      - run: cargo machete

  tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_migration.py
      # The all-modules patch set applies to the pin (seconds), so a conflict fails a required check.
      - run: python3 tools/patches.py check
      # No crate's unsafe count may rise above tools/unsafe_baseline.json.
      - run: python3 tools/unsafe_budget.py
      - run: tests/dev/run.sh

  # Whether this PR touches what the hybrid build compiles or installs with.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      hybrid: ${{ steps.paths.outputs.hybrid }}
      iouring: ${{ steps.paths.outputs.iouring }}
      cares: ${{ steps.paths.outputs.cares }}
      zts: ${{ steps.paths.outputs.zts }}
      threadcontext: ${{ steps.paths.outputs.threadcontext }}
      asan: ${{ steps.paths.outputs.asan }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "$changed"
          if echo "$changed" | grep -qE '^(migration/patches/|native/|tools/(build_(hybrid|upstream|ext)|arginfo)\.py$|crates/(phpstubs|ext)/|\.github/|\.devcontainer/)'; then
            echo hybrid=true >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -qE '^(migration/patches/hooks/|native/hooks/|crates/(hooks|uring[^/]*)/|\.github/workflows/iouring\.yml$|\.devcontainer/install\.sh$)'; then
            echo iouring=true >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -qE '^(migration/patches/(clients|corebase)/|crates/(clients|corebase|cares-sys)/|\.github/workflows/cares\.yml$)'; then
            echo cares=true >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -qE '^(migration/patches/(locks/|[^/]+/[^/]*thread)|crates/(phplocks|phpthread|phpstubs|zend[^/]*)/|native/(locks|phpthread)/|\.github/workflows/zts\.yml$|\.devcontainer/(install|php)\.sh$)'; then
            echo zts=true >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -qE '^(migration/patches/coroutine/|native/(coroutine|phpcoroutines)/|crates/(coroutine|phpcoroutines|phpcollections|process)/|\.github/workflows/threadcontext\.yml$)'; then
            echo threadcontext=true >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -qE '^(tools/asan\.py|\.github/workflows/asan\.yml|\.devcontainer/php\.sh)$'; then
            echo asan=true >> "$GITHUB_OUTPUT"
          fi

  # The all-modules hybrid with the halfclose repair, so no module's native code
  # merges without being compiled into the extension next to the others. Required
  # (main's ruleset); a PR that touches none of `changes`' paths skips it, which
  # GitHub counts as passing.
  hybrid:
    needs: changes
    if: needs.changes.outputs.hybrid == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Restores main's release build; hybrid build trees must start clean.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: false
      - run: rm -rf target/hybrid target/upstream target/thirdparty target/native-core
      - uses: ./.github/actions/install
      - id: upstream
        uses: actions/cache/restore@v4
        with:
          path: target/upstream
          key: upstream-${{ runner.os }}-${{ hashFiles('tools/build_upstream.py') }}
      - if: steps.upstream.outputs.cache-hit != 'true'
        run: python3 tools/build_upstream.py
      # crates/phpstubs is current, and says what the pin's gen_stub.php headers say.
      - run: python3 tools/arginfo.py --check
      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-
      - run: cargo fetch --locked
      # With the optional cURL and ssh2 hooks (the merge tier's phpt-build runs their PHPTs).
      - run: python3 tools/build_hybrid.py --fix-halfclose --configure=--enable-swoole-curl --configure=--with-swoole-ssh2
      # The extension built by Cargo alone (crates/ext, #1921), run side by side below.
      - run: python3 tools/build_ext.py
      # Compare SDK alias defaults independently of remote SSH service availability.
      - run: |
          cargo build --locked --release -p swoole-rs-ffi --features ssh2
          python3 tests/modules/hooks/ssh2_aliases.py --source target/upstream/src --archive target/release/libswoole_rs_ffi.a --output target/reports/ssh2-aliases.json
      - run: ccache --show-stats
      # Exercise SNI's deferred port resolution on the production extension before merging.
      - run: >
          python3 corpus/upstream/run.py
          --manifest tests/modules/ports/sni-originals.json
          --php-extension curl --php-extension sockets --require-all --isolate-cases
          --engine hybrid=target/hybrid/rust-halfclose/modules/swoole.so
          --output target/reports/ports-sni-originals.json
      # 12-hyperf needs composer; it runs in the merge tier.
      - run: >
          python3 corpus/run.py
          --php-extension pdo --php-extension pdo_sqlite --php-extension curl
          --project 01-hello --project 02-router --project 03-notes --project 04-job-service
          --project 05-coroutines --project 06-websocket --project 07-tcp-framing
          --project 08-timers --project 09-shared-table --project 10-task-workers
          --engine hybrid=target/hybrid/rust-halfclose/modules/swoole.so
          --engine cargo=target/ext/swoole.so
          --engine upstream=target/upstream/src/modules/swoole.so
          --output target/reports/corpus.json
      # Upstream truncates queued responses after a client half-close; --fix-halfclose repairs it.
      # The native cURL hook links ext/curl, so it loads first.
      - run: >
          python3 corpus/run.py --php-extension curl --project 11-buffer-lifecycle
          --engine hybrid=target/hybrid/rust-halfclose/modules/swoole.so
          --engine cargo=target/ext/swoole.so
          --output target/reports/corpus-halfclose.json
      # This run built main as of its push. Auto-merge follows the last required check
      # (usually this one) within seconds, so re-apply the patch set over main as it is now.
      - run: |
          git fetch -q origin main
          git -c user.name=ci -c user.email=ci@localhost merge -q --no-edit FETCH_HEAD
          python3 tools/patches.py check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-reports
          path: target/reports/

  # The io_uring build variant (merge tier), when a PR touches io_uring code. Informative.
  iouring:
    needs: changes
    if: needs.changes.outputs.iouring == 'true'
    uses: ./.github/workflows/iouring.yml

  # The c-ares build variant (merge tier), when a PR touches resolver code. Informative.
  cares:
    needs: changes
    if: needs.changes.outputs.cares == 'true'
    uses: ./.github/workflows/cares.yml

  # The ZTS build variant (merge tier), when a PR touches thread or ZTS code. Informative.
  zts:
    needs: changes
    if: needs.changes.outputs.zts == 'true'
    uses: ./.github/workflows/zts.yml

  # The thread-context build variant (merge tier), when a PR touches the coroutine context. Informative.
  threadcontext:
    needs: changes
    if: needs.changes.outputs.threadcontext == 'true'
    uses: ./.github/workflows/threadcontext.yml

  # The sanitizer run (nightly), when a PR touches it. Informative.
  asan:
    needs: changes
    if: needs.changes.outputs.asan == 'true'
    uses: ./.github/workflows/asan.yml

  # Candidate-lane gates of the modules this PR touches (every module for shared
  # build inputs); prints "No module touched" and passes otherwise. Advisory until
  # the gates main already fails are fixed (#106): read its result, it never blocks.
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: touched
        run: python3 -c "from tools.dev import changed_modules; print('modules=' + ' '.join(changed_modules('origin/${{ github.base_ref }}')))" >> "$GITHUB_OUTPUT"
      - if: steps.touched.outputs.modules != ''
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: false
      - if: steps.touched.outputs.modules != ''
        run: rm -rf target/hybrid target/upstream target/thirdparty target/native-core
      - if: steps.touched.outputs.modules != ''
        uses: ./.github/actions/install
      - if: steps.touched.outputs.modules != ''
        id: upstream
        uses: actions/cache/restore@v4
        with:
          path: target/upstream
          key: upstream-${{ runner.os }}-${{ hashFiles('tools/build_upstream.py') }}
      - if: steps.touched.outputs.modules != '' && steps.upstream.outputs.cache-hit != 'true'
        run: python3 tools/build_upstream.py
      - if: steps.touched.outputs.modules != ''
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-
      - if: steps.touched.outputs.modules != ''
        run: cargo fetch --locked
      - if: steps.touched.outputs.modules != ''
        run: >
          python3 tools/dev.py candidate --changed-since origin/${{ github.base_ref }}
          --php-extension pdo --php-extension pdo_sqlite --php-extension curl --php-extension sockets --php-extension tokenizer --php-extension ffi
      - uses: actions/upload-artifact@v4
        if: always() && steps.touched.outputs.modules != ''
        with:
          name: gates-reports
          path: target/reports/
