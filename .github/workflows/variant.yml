name: variant
# One build variant of upstream and the Cargo-built swoole.so, then the PHPT families its code
# reaches on both engines (corpus/upstream/families.sh): any test that passes on upstream must
# pass on the Cargo build. The merge tier runs every variant, the PR tier those a PR touches.
on:
  workflow_call:
    inputs:
      variant:
        type: string
        required: true
      callgrind:
        description: Count the variant's own callgrind workload (benchmarks/callgrind.py), if it has one
        type: boolean
        default: false
defaults:
  run:
    shell: bash

jobs:
  phpt:
    runs-on: gcrunner=${{ github.run_id }}/runner=standard
    timeout-minutes: 30
    env:
      VARIANT: ${{ inputs.variant }}
    steps:
      - uses: actions/checkout@v7
      - id: install
        uses: ./.github/actions/install
      # Each variant's build flags, the --ri swoole line that shows them, and its families.
      - name: Set variant options
        run: |
          php=php abi='--php-extension sockets'
          run=$(sed -n 's/^extension=\(.*\)/--php-extension \1/p' /etc/php/*/cli/conf.d/*.ini | sed 's/\.so$//' | tr '\n' ' ')
          case $VARIANT in
            # Upstream's own io_uring CI (SWOOLE_IOURING), and the families whose paths io_uring
            # replaces (System::sleep, waitpid, coroutine locks).
            iouring) build='--configure=--enable-iouring --configure=--enable-uring-socket' probe='io_uring|uring_socket'
              families='swoole_iouring swoole_runtime swoole_coroutine_lock swoole_coroutine_system';;
            # libcares resolves coroutine DNS lookups instead of the built-in UDP client.
            cares) build=--configure=--enable-cares probe=c-ares
              families='swoole_coroutine swoole_coroutine_system swoole_client_coro swoole_http_client_coro swoole_socket_coro';;
            # Each coroutine on its own thread (crates/coroutine/src/thread.rs).
            threadcontext) build=--configure=--enable-thread-context probe='thread context'
              families='swoole_coroutine swoole_channel_coro swoole_coroutine_scheduler swoole_coroutine_system swoole_event';;
            # A thread-safe PHP, whose headers zend-sys binds (PHP_CONFIG), with sockets and curl
            # compiled in: upstream's own thread CI (SWOOLE_THREAD), and Thread\Atomic and Thread\Lock,
            # which only exist in this build; also the collection facade fixtures
            # (tests/modules/phpcollections).
            zts) php=$PWD/target/php-zts/bin/php
              run="--php $php" abi="--php $php --php-config $php-config" phpize="--phpize ${php}ize"
              build="--php-config $php-config --php-sockets --configure=--enable-swoole-thread" probe='^thread[ ]'
              families='swoole_thread swoole_atomic swoole_lock';;
            *) echo "no variant $VARIANT"; exit 1;;
          esac
          {
            echo "PHP=$php"; echo "RUN=$run"; echo "ABI=$abi"; echo "BUILD=$build"; echo "PROBE=$probe"
            echo "UPSTREAM=$build $phpize"; echo "FAMILIES=$(printf -- '--module %s ' $families)"
          } >> "$GITHUB_ENV"
      # ZTS: main's release build has the dependencies; zend-sys and the crates above it rebuild
      # against this PHP. Build trees must start clean.
      - if: inputs.variant == 'zts'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: false
      - name: Clear cached builds
        if: inputs.variant == 'zts'
        run: rm -rf target/ext target/upstream target/thirdparty target/native-core
      - if: inputs.variant == 'zts'
        uses: actions/cache@v6
        with:
          path: target/php-zts
          key: php-zts-${{ runner.os }}-${{ hashFiles('.devcontainer/php.sh') }}-${{ github.workspace }}
      - name: Build ZTS PHP
        if: inputs.variant == 'zts'
        run: .devcontainer/php.sh target/php-zts --enable-zts
      - id: upstream
        uses: ./.github/actions/upstream
        with:
          args: ${{ env.UPSTREAM }}
          php: ${{ inputs.variant == 'zts' && hashFiles('.devcontainer/php.sh') || steps.install.outputs.php }}
      - name: Fetch crates
        run: cargo fetch --locked
      - name: Lint and test clients with c-ares
        if: inputs.variant == 'cares'
        run: |
          cargo clippy --locked -p swoole-rs-clients --features cares --all-targets -- -D warnings
          cargo test --locked -p swoole-rs-clients --features cares completion_
      # The control is the pinned reference itself, unpatched.
      - name: Build cargo engine
        run: |
          python3 tools/build_ext.py $BUILD
          mkdir -p "target/phpt/$VARIANT"
          cp ${{ steps.upstream.outputs.library }} target/phpt/upstream.so
          cp target/ext/swoole.so target/phpt/cargo.so
          for engine in upstream cargo; do "$PHP" -n -d extension=$PWD/target/phpt/$engine.so --ri swoole | grep -E "$PROBE"; done
      # Every swr_v* this build's config.h declares is exported.
      - name: ABI export gate
        timeout-minutes: 5
        run: >
          python3 tests/modules/integration/test_bridge.py --startup-only $ABI
          --extension target/ext/swoole.so --reference target/phpt/upstream.so
      # On a PR, upstream's report comes from main's latest run of this job while nothing it
      # depends on has changed since (tools/ci.py phpt-baseline); the merge tier runs both engines.
      - name: Load upstream baseline
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: corpus/upstream/baseline.sh "$VARIANT" "$PHP"
      - name: Run c-ares runtime cases
        if: inputs.variant == 'cares'
        run: >
          python3 tests/modules/clients/cares.py $RUN
          --engine upstream=target/phpt/upstream.so --engine cargo=target/phpt/cargo.so
          --output target/phpt/cares/runtime.json
      # The original System DNS timeout case against a resolver that answers late (#1190).
      # Its 712 comes from c-ares's own timeout; the thread-pool lookup reports 10018 on
      # both engines, and the runner's resolver fails before the 1 ms deadline.
      - name: Run DNS timeout originals
        if: inputs.variant == 'cares'
        run: >
          sudo python3 tests/modules/corebase/slow_resolver.py --
          python3 corpus/upstream/run.py
          --manifest tests/modules/corebase/dns-timeout-originals.json --external-network --require-all $RUN
          --engine upstream=target/phpt/upstream.so --engine cargo=target/phpt/cargo.so
          --output target/phpt/cares/dns-timeout-originals.json
      - if: inputs.variant == 'zts'
        name: Composed whole-thread escape scopes
        run: >
          python3 tests/modules/phphelpers/exit_guard.py --php "$PHP" --php-config "$PHP-config"
          --engine upstream=target/phpt/upstream.so --engine cargo=target/phpt/cargo.so
          --build-manifest target/ext/build-manifest.json --output target/phpt/zts/guard.json
      - if: inputs.variant == 'zts'
        name: Collection facades under ZTS
        run: |
          for profile in complete column-bytes; do
            python3 tests/modules/phpcollections/php_runtime.py --profile $profile --php "$PHP" \
              --engine cargo=target/phpt/cargo.so --engine upstream=target/phpt/upstream.so \
              --build-manifest target/ext/build-manifest.json \
              --output target/phpt/zts/collections-$profile.json
          done
      - name: Run and gate PHPTs
        run: corpus/upstream/families.sh "target/phpt/$VARIANT" target/phpt/upstream.so target/phpt/cargo.so $FAMILIES $RUN
      - if: inputs.variant == 'zts'
        name: Thread server exit lifecycle companion
        run: >
          python3 tests/modules/integration/server_exit.py --checkout "$PWD" --source target/upstream/src
          --runner target/upstream/src/run-tests.php --php "$PHP"
          --engine upstream=target/phpt/upstream.so --engine cargo=target/phpt/cargo.so
          --output target/phpt/zts/server-exit-companion.json
      # The workload only this variant's build runs (#2683), against its record like merge.yml's
      # callgrind job: a file read through io_uring, or a Swoole\Thread start and join. A thread
      # start costs 45.6M instructions, so 30 of them measure the ratio that 1,000 took 11 minutes to.
      - name: Count instructions
        if: inputs.callgrind && (inputs.variant == 'iouring' || inputs.variant == 'zts')
        run: |
          sudo apt-get install -yq valgrind
          if [ "$VARIANT" = zts ]; then set -- --workload thread --requests 30 --warmup 5; else set -- --workload uring-file --requests 1000; fi
          python3 benchmarks/callgrind.py --limits benchmarks/callgrind_limits "$@" $RUN \
            --engine cargo=target/phpt/cargo.so --engine upstream=target/phpt/upstream.so \
            --output "target/phpt/$VARIANT/callgrind.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: phpt-${{ inputs.variant }}
          path: |
            target/phpt/${{ inputs.variant }}/
            !target/phpt/${{ inputs.variant }}/engines/**
