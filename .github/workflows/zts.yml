name: ZTS
# Upstream and the Cargo-built swoole.so built against a thread-safe PHP with
# --enable-swoole-thread, then the PHPTs upstream's own thread CI runs (swoole_thread,
# scripts/run-tests.sh with SWOOLE_THREAD) plus the atomic and lock families, whose
# Thread\Atomic and Thread\Lock only exist in this build. Any test that passes on
# upstream must pass on the Cargo build. zend-sys binds the ZTS headers (PHP_CONFIG).
# Called by the merge tier, and by the PR tier when a PR touches thread or ZTS code.
on:
  workflow_call:
defaults:
  run:
    shell: bash

jobs:
  phpt:
    runs-on: gcrunner=${{ github.run_id }}/runner=standard
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install
      # Main's release build: the dependencies; zend-sys and the crates above it rebuild
      # against this PHP (PHP_CONFIG). Build trees must start clean.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: false
      - run: rm -rf target/ext target/upstream target/thirdparty target/native-core
      - uses: actions/cache@v4
        with:
          path: target/php-zts
          key: php-zts-${{ runner.os }}-${{ hashFiles('.devcontainer/php.sh') }}-${{ github.workspace }}
      - run: .devcontainer/php.sh target/php-zts --enable-zts
      - id: upstream
        uses: ./.github/actions/upstream
        with:
          args: --php-config ${{ github.workspace }}/target/php-zts/bin/php-config --phpize ${{ github.workspace }}/target/php-zts/bin/phpize --php-sockets --configure=--enable-swoole-thread
          php: ${{ hashFiles('.devcontainer/php.sh') }}
      - run: cargo fetch --locked
      # The control is the pinned reference itself, unpatched.
      - run: |
          python3 tools/build_ext.py --php-config $PWD/target/php-zts/bin/php-config --php-sockets --configure=--enable-swoole-thread
          mkdir -p target/phpt
          cp ${{ steps.upstream.outputs.library }} target/phpt/upstream.so
          cp target/ext/swoole.so target/phpt/cargo.so
          for engine in upstream cargo; do target/php-zts/bin/php -n -d extension=$PWD/target/phpt/$engine.so --ri swoole | grep -E '^thread '; done
          python3 corpus/upstream/inventory.py --output target/phpt/manifest.json
      # On a PR, upstream's report comes from main's latest run of this job while nothing it
      # depends on has changed since (tools/ci.py phpt-baseline); the merge tier runs both engines.
      - if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: corpus/upstream/baseline.sh zts target/php-zts/bin/php
      - name: Composed whole-thread escape scopes
        run: |
          python3 tests/modules/phphelpers/exit_guard.py --php "$PWD/target/php-zts/bin/php" \
            --php-config "$PWD/target/php-zts/bin/php-config" \
            --engine upstream=target/phpt/upstream.so --engine cargo=target/phpt/cargo.so \
            --build-manifest target/ext/build-manifest.json --output target/phpt/guard.json
      - run: |
          families="--module swoole_thread --module swoole_atomic --module swoole_lock"
          options="--manifest target/phpt/manifest.json --timeout 30 --php $PWD/target/php-zts/bin/php"
          mkdir -p target/phpt/zts
          for engine in upstream cargo; do
            [ ! -f target/phpt/zts/$engine.json ] || continue  # the baseline's
            python3 corpus/upstream/run.py $options $families --engine $engine=target/phpt/$engine.so \
              --output target/phpt/zts/$engine.json || [ $? -eq 1 ]
          done
          corpus/upstream/recheck.sh target/phpt/zts target/phpt target/phpt/recheck $options
          set -- target/phpt/zts/*.json
          if ls target/phpt/recheck/*.json >/dev/null 2>&1; then set -- "$@" --recheck target/phpt/recheck/*.json; fi
          python3 corpus/upstream/gate.py "$@" --output phpt-zts.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Thread server exit lifecycle companion
        run: |
          python3 tests/modules/integration/server_exit.py --checkout "$PWD" --source target/upstream/src \
            --runner target/upstream/src/run-tests.php --php "$PWD/target/php-zts/bin/php" \
            --engine upstream=target/phpt/upstream.so --engine cargo=target/phpt/cargo.so \
            --output target/phpt/server-exit-companion.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phpt-zts
          path: |
            phpt-zts.json
            target/phpt/zts/
            target/phpt/recheck/
            target/phpt/guard.json
            target/phpt/server-exit-companion.json
            target/phpt/server-exit-*/
