name: Merge
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 500M
# Latest wins: one run at a time; GitHub keeps only the newest push pending, so the
# next run always covers main's head. Never cancel-in-progress, or no run finishes.
concurrency:
  group: merge-${{ github.ref }}
# Explicit bash runs steps with -eo pipefail; the default (`bash -e`) lets a pipe
# like `gate.py | tee` report success when gate.py fails.
defaults:
  run:
    shell: bash

jobs:
  # dev.py's phases are CPU-bound (about 77 CPU-minutes), so they run as three slices on
  # three runners: phases that compile with every core slow each other down, so two slices
  # balanced by weight left one near 20 minutes (#318). Each slice builds the all-modules
  # hybrid and runs the builds; the rest is split by tools/phase_weights.json (dev.py --shard).
  full-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        # Gates compare against accepted patch states at older commits (git show <sha>:...).
        with:
          fetch-depth: 0
      # Saved from main under a key the PR tier's hybrid and gates jobs restore.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      # rust-cache restores all of target/: git checkouts without a usable .git, and
      # native-core builds whose receipt outlives its binary or library. Those trees come
      # from their own caches, a fresh clone or a ccache-backed rebuild instead.
      - run: rm -rf target/hybrid target/upstream target/thirdparty target/native-core
      - uses: ./.github/actions/install
      # Caches are saved as soon as they are built, so a failing gate later does not discard
      # them; PR branches can only restore caches saved on main.
      - id: upstream
        uses: actions/cache/restore@v4
        with:
          path: target/upstream
          key: upstream-${{ runner.os }}-${{ hashFiles('tools/build_upstream.py') }}
      - if: steps.upstream.outputs.cache-hit != 'true'
        run: python3 tools/build_upstream.py
      - if: steps.upstream.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: target/upstream
          key: ${{ steps.upstream.outputs.cache-primary-key }}
      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-
      - run: cargo fetch --locked
      - run: python3 corpus/thirdparty/hyperf.py --prepare
      - run: python3 tests/modules/buffer/baseline.py --sanitize
      # Unit, native, ABI, model and PHP gates, every application and original PHPT, upstream as control.
      - run: python3 tools/dev.py integrate --all-modules --php-extension pdo --php-extension pdo_sqlite --php-extension curl --php-extension sockets --php-extension tokenizer --php-extension ffi --external-network --php-sockets --shard ${{ matrix.shard }}/3
      - if: always()
        run: python3 tools/merge_summary.py >> "$GITHUB_STEP_SUMMARY"
      - if: always() && matrix.shard == 1
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
      # Small on purpose: tools/ci.py downloads it to list failed, new and fixed phases.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phases-${{ matrix.shard }}
          path: target/reports/dev/*/loop.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports-${{ matrix.shard }}
          # Logs and JSON only: the exported swoole.so and Rust archives were ~140 MB of
          # each shard's ~158 MB and are rebuilt from the commit.
          path: |
            target/reports/
            !target/reports/**/*.so
            !target/reports/**/*.a
            !target/reports/**/*.o
            target/upstream/build.log
            target/hybrid/*/build-manifest.json

  # Every merge-tier run saves a ccache of about 500 MB under its own sha, and the repo's
  # caches share 10 GB; jobs restore the newest, so keep two and delete the rest.
  ccache-prune:
    needs: full-gates
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: >
          gh cache list --ref refs/heads/main --key ccache-${{ runner.os }}- --sort created_at --order desc
          --limit 100 --json id --jq '.[2:][].id' | xargs -r -n1 gh cache delete

  # Every pinned PHPT on upstream and on the all-modules hybrid: any test that passes
  # on upstream must pass on the hybrid (corpus/upstream/gate.py).
  phpt-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      php: ${{ steps.install.outputs.php }}
    steps:
      - uses: actions/checkout@v4
      - id: install
        uses: ./.github/actions/install
        with:
          packages: firebird-dev
          php: latest
      - id: upstream
        uses: actions/cache@v4
        with:
          path: target/upstream
          key: upstream-${{ runner.os }}-${{ hashFiles('tools/build_upstream.py') }}
      - if: steps.upstream.outputs.cache-hit != 'true'
        run: python3 tools/build_upstream.py
      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-
      - run: cargo fetch --locked
      - run: |
          # Database, cURL and ssh2 hooks as upstream's own CI builds them (scripts/docker-compile.sh).
          services="--configure=--enable-swoole-pgsql --configure=--enable-mysqlnd --configure=--with-swoole-odbc=unixODBC,/usr --configure=--with-swoole-firebird"
          services="$services --configure=--enable-swoole-curl --configure=--with-swoole-ssh2"
          python3 tools/build_hybrid.py --backend upstream --php-sockets $services | tee upstream.log
          python3 tools/build_hybrid.py --php-sockets $services | tee hybrid.log
          mkdir -p target/phpt
          cp -L "$(sed -n 's/^\(Built\|Cached\) upstream: //p' upstream.log)" target/phpt/upstream.so
          cp -L "$(sed -n 's/^\(Built\|Cached\) rust: //p' hybrid.log)" target/phpt/hybrid.so
      - uses: actions/upload-artifact@v4
        with:
          name: phpt-engines
          path: target/phpt/

  # The speed ratchet (docs/migration.md#speed): instructions per request on the all-modules
  # hybrid over upstream may not rise more than 1% above benchmarks/callgrind_limits.json.
  # plaintext covers the bridge, echo-1k buffer, json the router app and service-health the
  # SQLite service's dispatch (php -n: PDO is dynamic).
  # echo-1k, not echo-64k: a 64 KiB body arrives split differently on each runner, and
  # upstream's per-byte Expect scan of whatever is buffered then decides the ratio (#338).
  # websocket (frame codec) and timer (add/clear churn) exercise those two modules most;
  # they ride the same ratchet so the merge tier measures graduation criterion 3 (#117,
  # #118). The fixed +5% graduation ceiling itself moves to Phase 6 (#430).
  callgrind:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install
        with:
          packages: valgrind
      - uses: actions/cache/restore@v4
        with:
          path: target/upstream
          key: upstream-${{ runner.os }}-${{ hashFiles('tools/build_upstream.py') }}
      - if: hashFiles('target/upstream/src/modules/swoole.so') == ''
        run: python3 tools/build_upstream.py
      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-
      - run: cargo fetch --locked
      - run: python3 tools/build_hybrid.py | tee hybrid.log
      - run: >
          python3 benchmarks/callgrind.py --requests 1000 --limits benchmarks/callgrind_limits.json
          --workload plaintext --workload echo-1k --workload json --workload service-health
          --workload websocket --workload timer
          --php-extension pdo --php-extension pdo_sqlite
          --engine hybrid=$(sed -n 's/^\(Built\|Cached\) rust: //p' hybrid.log)
          --engine upstream=target/upstream/src/modules/swoole.so
          --profiles target/callgrind/profiles --output callgrind.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: callgrind
          path: |
            callgrind.json
            target/callgrind/profiles/

  # swoole_stdext needs the experimental --stdext build, which changes PHP itself
  # (typed arrays, methods on scalars), so it gets its own engines and its own gate.
  phpt-stdext:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install
      - uses: actions/cache/restore@v4
        with:
          path: target/upstream
          key: upstream-${{ runner.os }}-${{ hashFiles('tools/build_upstream.py') }}
      - if: hashFiles('target/upstream/src/run-tests.php') == ''
        run: python3 tools/build_upstream.py
      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-
      - run: cargo fetch --locked
      - run: |
          python3 tools/build_hybrid.py --backend upstream --stdext | tee upstream.log
          python3 tools/build_hybrid.py --stdext | tee hybrid.log
          mkdir -p target/phpt
          cp -L "$(sed -n 's/^\(Built\|Cached\) upstream: //p' upstream.log)" target/phpt/upstream.so
          cp -L "$(sed -n 's/^\(Built\|Cached\) rust: //p' hybrid.log)" target/phpt/hybrid.so
          python3 corpus/upstream/inventory.py --output target/phpt/manifest.json
      - id: extensions
        run: echo "args=$(sed -n 's/^extension=\(.*\)/--php-extension \1/p' /etc/php/*/cli/conf.d/*.ini | sed 's/\.so$//' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      # Re-run flagged tests as phpt-gate does: method.phpt's rand assertion fails ~10% (#368).
      - run: |
          mkdir -p target/phpt/stdext
          for engine in upstream hybrid; do
            python3 corpus/upstream/run.py --manifest target/phpt/manifest.json --module swoole_stdext --timeout 30 \
              ${{ steps.extensions.outputs.args }} --engine $engine=target/phpt/$engine.so \
              --output target/phpt/stdext/$engine.json || [ $? -eq 1 ]
          done
          corpus/upstream/recheck.sh target/phpt/stdext target/phpt target/phpt/recheck \
            --manifest target/phpt/manifest.json --timeout 30 ${{ steps.extensions.outputs.args }}
          set -- target/phpt/stdext/*.json
          if ls target/phpt/recheck/*.json >/dev/null 2>&1; then set -- "$@" --recheck target/phpt/recheck/*.json; fi
          python3 corpus/upstream/gate.py "$@" --output phpt-stdext.json >> "$GITHUB_STEP_SUMMARY"
      # phphelpers' runtime fixtures call stdext helpers, so they run here, not in full-gates.
      - if: always()
        run: >
          python3 tools/dev.py integrate --module phphelpers --stdext
          --php-extension pdo --php-extension pdo_sqlite --php-extension curl --php-extension sockets --php-extension tokenizer --php-extension ffi
          --phase build --phase stdext-reference-build --phase phphelpers-sdk
          --phase phphelpers-facade-runtime --phase phphelpers-entrypoint --phase phphelpers-runtime
      # tools/ci.py reads phases* artifacts for new and fixed phases.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phases-stdext
          # Keep structured per-engine outcomes and logs; never SDK mirrors,
          # compiled helpers, exported engines, archives or build caches.
          path: |
            target/reports/dev/*/*.json
            target/reports/dev/*/*.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phpt-stdext
          path: phpt-stdext.json

  # The --enable-iouring --enable-uring-socket build variant and its PHPTs.
  iouring:
    uses: ./.github/workflows/iouring.yml

  # The --enable-cares build variant and its PHPTs.
  cares:
    uses: ./.github/workflows/cares.yml

  # The thread-safe PHP --enable-swoole-thread build variant and its PHPTs.
  zts:
    uses: ./.github/workflows/zts.yml

  # The opt-in --fix-halfclose repair (M15) is its own build variant, so its gates run
  # here; full-gates builds without it.
  halfclose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install
      - uses: actions/cache/restore@v4
        with:
          path: target/upstream
          key: upstream-${{ runner.os }}-${{ hashFiles('tools/build_upstream.py') }}
      - if: hashFiles('target/upstream/src/run-tests.php') == ''
        run: python3 tools/build_upstream.py
      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-
      - run: cargo fetch --locked
      - run: python3 tools/dev.py integrate --fix-halfclose --php-extension sockets --phase 'halfclose-*' --with-prerequisites
      # tools/ci.py reads phases* artifacts for new and fixed phases.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phases-halfclose
          path: target/reports/dev/*/loop.json

  phpt:
    needs: phpt-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        index: [1, 2, 3, 4, 5, 6]
        engine: [upstream, hybrid]
    # The services upstream's PHPTs expect, as in its scripts/docker-compose.yml, under
    # the host names its tests/include/config.php uses on CI (httpbin at http://httpbin:80).
    services:
      httpbin:
        image: kennethreitz/httpbin
        ports: ['80:80']
      pgsql:
        image: postgres:14
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 2s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -proot" --health-interval 2s --health-retries 60
      redis:
        image: redis:7.4
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-retries 30
      # Creates /var/lib/firebird/data/test.fdb, the database FIREBIRD_DSN names.
      firebirdsql:
        image: firebirdsql/firebird
        env:
          FIREBIRD_ROOT_PASSWORD: root
          FIREBIRD_USER: test
          FIREBIRD_PASSWORD: test
          FIREBIRD_DATABASE: test.fdb
          FIREBIRD_DATABASE_DEFAULT_CHARSET: UTF8
        ports: ['3050:3050']
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/phpt-env
        with:
          php: ${{ needs.phpt-build.outputs.php }}
      - run: python3 corpus/upstream/inventory.py --shard ${{ matrix.index }}/6 --output target/phpt/manifest.json
      # php -n loads nothing; load every extension the distribution enables, in its order.
      - id: extensions
        run: echo "args=$(sed -n 's/^extension=\(.*\)/--php-extension \1/p' /etc/php/*/cli/conf.d/*.ini | sed 's/\.so$//' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      # Exit 1 means some tests failed, which the gate judges; anything else (a runner
      # crash) fails the shard.
      - run: >
          python3 corpus/upstream/run.py --manifest target/phpt/manifest.json --timeout 30 --external-network
          ${{ steps.extensions.outputs.args }}
          --engine ${{ matrix.engine }}=target/phpt/${{ matrix.engine }}.so
          --output target/phpt/${{ matrix.engine }}-${{ matrix.index }}.json || [ $? -eq 1 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phpt-${{ matrix.engine }}-${{ matrix.index }}
          path: target/phpt/${{ matrix.engine }}-${{ matrix.index }}.json

  phpt-gate:
    needs: [phpt-build, phpt]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Same services as the shards: flagged tests are re-run here (#174).
    services:
      httpbin:
        image: kennethreitz/httpbin
        ports: ['80:80']
      pgsql:
        image: postgres:14
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 2s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -proot" --health-interval 2s --health-retries 60
      redis:
        image: redis:7.4
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-retries 30
      # Creates /var/lib/firebird/data/test.fdb, the database FIREBIRD_DSN names.
      firebirdsql:
        image: firebirdsql/firebird
        env:
          FIREBIRD_ROOT_PASSWORD: root
          FIREBIRD_USER: test
          FIREBIRD_PASSWORD: test
          FIREBIRD_DATABASE: test.fdb
          FIREBIRD_DATABASE_DEFAULT_CHARSET: UTF8
        ports: ['3050:3050']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: phpt-*-*
          merge-multiple: true
          path: shards
      # Tests that pass on upstream but not on the hybrid get 3 re-runs per engine, unless
      # more than 20 are flagged: that is a broad breakage, not flakiness.
      - id: flagged
        run: |
          python3 corpus/upstream/gate.py shards/*.json --print-regressions > flagged.txt
          count=$(grep -c . flagged.txt || true)
          echo "rerun=$([ "$count" -gt 0 ] && [ "$count" -le 20 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.flagged.outputs.rerun == 'true'
        uses: ./.github/actions/phpt-env
        with:
          php: ${{ needs.phpt-build.outputs.php }}
      - if: steps.flagged.outputs.rerun == 'true'
        run: |
          python3 corpus/upstream/inventory.py --output target/phpt/all.json
          extensions=$(sed -n 's/^extension=\(.*\)/--php-extension \1/p' /etc/php/*/cli/conf.d/*.ini | sed 's/\.so$//' | tr '\n' ' ')
          corpus/upstream/recheck.sh shards target/phpt recheck \
            --manifest target/phpt/all.json --timeout 30 --external-network $extensions
      - run: |
          set -- shards/*.json
          if [ -d recheck ]; then set -- "$@" --recheck recheck/*.json; fi
          python3 corpus/upstream/gate.py "$@" --output phpt.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phpt
          path: |
            phpt.json
            flagged.txt
            recheck/
      - if: needs.phpt.result != 'success'
        run: echo "A PHPT shard crashed; its tests are missing from the gate" && exit 1

  # musl and PHP 8.5, as on php:8.5-alpine in Appwrite's base image: build the
  # reference and the all-modules hybrid, then run the corpus and original PHPTs
  # against both. Project 11 needs --fix-halfclose and is covered by the PR tier.
  alpine:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: php:8.5-alpine
    # The image has no bash, so this job can't use the workflow's bash default.
    defaults:
      run:
        shell: sh
    env:
      PHP_EXTENSIONS: --php-extension sockets --php-extension pcntl
      # musl build scripts link statically and cannot dlopen libclang (zend-sys's bindgen).
      RUSTFLAGS: -C target-feature=-crt-static
    steps:
      - run: apk add --no-cache git && git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
      - run: .devcontainer/install-alpine.sh && echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: python3 tools/build_upstream.py --php-sockets
      - run: cargo fetch --locked
      - run: python3 tools/build_hybrid.py --php-sockets
      - run: python3 corpus/thirdparty/hyperf.py --prepare
      - run: >
          python3 corpus/run.py $PHP_EXTENSIONS --require-all
          $(for p in 01-hello 02-router 03-notes 04-job-service 05-coroutines 06-websocket 07-tcp-framing 08-timers 09-shared-table 10-task-workers 12-hyperf-skeleton; do echo --project $p; done)
          --engine upstream=target/upstream/src/modules/swoole.so
          --engine hybrid=target/hybrid/rust-php-sockets/modules/swoole.so
          --output target/reports/alpine-corpus.json
      # gate.py fails only what passes on upstream and not on the hybrid (no re-runs: no bash).
      - if: always()
        run: |
          python3 corpus/upstream/run.py $PHP_EXTENSIONS \
            --engine upstream=target/upstream/src/modules/swoole.so \
            --engine hybrid=target/hybrid/rust-php-sockets/modules/swoole.so \
            --output target/reports/alpine-phpt.json || [ $? -eq 1 ]
          python3 corpus/upstream/gate.py target/reports/alpine-phpt.json --output target/reports/alpine-gate.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpine-reports
          path: target/reports/
