name: Badges
# README progress badges: shields.io endpoint JSON (tools/badges.py) on the `badges`
# branch. The static ones update on every push to main; the PHPT and speed ones when a
# merge-tier run on main completes, from that run's gate and callgrind job; coverage from
# the newest nightly coverage.yml run on main.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Merge, Coverage]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  issues: write
concurrency:
  group: badges
defaults:
  run:
    shell: bash
jobs:
  badges:
    # Latest-wins cancels most merge-tier runs, and a cancelled one has nothing new to show.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: gcrunner=${{ github.run_id }}/runner=small
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # The newest finished merge-tier run on main with a gate result (a gate missing a shard
      # uploads no phpt.json), and its build variants' gates. Latest-wins cancels most runs,
      # so they are skipped before the limit, or 20 of them hide every finished run.
      # Not on a push: a push changes none of the run results below, and looking them up costs
      # about 40 API calls from the hourly limit every job shares. The badges that come from
      # the checkout are still rewritten.
      - id: gate
        if: github.event_name != 'push'
        run: |
          for run in $(gh run list --workflow merge.yml --branch main --status completed --limit 100 --json databaseId,conclusion -q '.[] | select(.conclusion != "cancelled") | .databaseId'); do
            if gh run download "$run" -n phpt -D gate/phpt 2>/dev/null && [ -f gate/phpt/phpt.json ]; then
              for variant in zts stdext iouring cares threadcontext alpine root; do
                gh run download "$run" -n "phpt-$variant" -D "gate/$variant" 2>/dev/null || echo "::warning::run $run has no phpt-$variant gate"
              done
              echo "commit=$(gh run view "$run" --json headSha -q .headSha)" >> "$GITHUB_OUTPUT"
              break
            fi
            rm -rf gate
          done
      # The two newest completed merge-tier runs on main whose callgrind job uploaded a result
      # (it uploads one when the limits fail too, which is when the badge matters most):
      # cg/ is the newest, for the badge, and cg-previous/ the one before it.
      - id: callgrind
        if: github.event_name != 'push'
        run: |
          for run in $(gh run list --workflow merge.yml --branch main --status completed --limit 100 --json databaseId,conclusion -q '.[] | select(.conclusion != "cancelled") | .databaseId'); do
            dir=cg
            [ -f cg/callgrind.json ] && dir=cg-previous
            if ! gh run download "$run" -n callgrind -D "$dir" 2>/dev/null || [ ! -f "$dir/callgrind.json" ]; then
              rm -rf "$dir"
            elif [ "$dir" = cg ]; then
              echo "commit=$(gh run view "$run" --json headSha -q .headSha)" >> "$GITHUB_OUTPUT"
            else
              break
            fi
          done
      # When both runs beat a record once rounded up, file one ready ticket for an executor
      # (GITHUB_TOKEN may not open pull requests here, and one it opened would start no PR tier).
      - if: hashFiles('cg-previous/callgrind.json') != ''
        run: |
          lowered=$(python3 benchmarks/callgrind.py --limits benchmarks/callgrind_limits.json --ratchet cg/callgrind.json cg-previous/callgrind.json)
          [ -n "$lowered" ] || exit 0
          title='callgrind: lower the limits the last two merge runs beat'
          body="The last two merge-tier callgrind results both beat these records, rounded up to two decimals (benchmarks/callgrind.py --ratchet). Lower them in benchmarks/callgrind_limits.json in a one-line PR (#1910).

          $(git diff -U0 benchmarks/callgrind_limits.json | sed 's/^/    /')"
          git checkout benchmarks/callgrind_limits.json
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number -q '.[0].number')
          if [ -n "$open" ]; then
            gh issue edit "$open" --body "$body"
          else
            url=$(gh issue create --title "$title" --body "$body" --label status:ready --label p2 --label kind:ci --assignee loks0n)
            id=$(gh api "repos/$GITHUB_REPOSITORY/issues/${url##*/}" -q .id)
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/1894/sub_issues" -F sub_issue_id="$id"
          fi
      # The newest completed Coverage run on main whose report job uploaded a summary.
      - if: github.event_name != 'push'
        run: |
          for run in $(gh run list --workflow coverage.yml --branch main --status completed --limit 5 --json databaseId -q '.[].databaseId'); do
            gh run download "$run" -n coverage -D coverage 2>/dev/null && [ -f coverage/summary.json ] && break
            rm -rf coverage
          done
      - run: git clone -q --depth 1 --branch badges "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY" out || git init -q -b badges out
      - run: >
          python3 tools/badges.py --output out
          ${{ steps.gate.outputs.commit && format('--phpt gate/*/phpt*.json --commit {0}', steps.gate.outputs.commit) || '' }}
          ${{ steps.callgrind.outputs.commit && format('--callgrind cg/callgrind.json --callgrind-commit {0}', steps.callgrind.outputs.commit) || '' }}
          ${{ hashFiles('coverage/summary.json') != '' && '--coverage coverage' || '' }}
      - working-directory: out
        run: |
          git add -A
          git diff --cached --quiet && exit 0
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -qm "badges for ${GITHUB_SHA::7}"
          git push -q "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY" HEAD:badges
