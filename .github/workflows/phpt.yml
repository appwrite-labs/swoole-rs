name: PHPT
# Upstream's pinned PHPTs, sharded six ways per engine, and the gate: any test that passes on
# upstream must pass on every other engine (corpus/upstream/gate.py). The caller builds the
# phpt-engines artifact first (.github/actions/phpt-build). The merge tier runs every family
# on upstream and the Cargo build. The PR tier runs the families of the modules
# a PR touches on the Cargo build alone, and gates it on the upstream reports and upstream.so
# of main's latest merge-tier run (BASELINE): upstream doesn't change between PRs.
on:
  workflow_call:
    inputs:
      php:
        description: The PHP package version the engines were built against
        required: true
        type: string
      engines:
        description: JSON list of the engines phpt-engines holds and the shards run
        default: '["upstream", "cargo"]'
        type: string
      families:
        description: The families (tests/<family>/) to run, space separated; empty runs all
        default: ''
        type: string
      baseline:
        description: A merge-tier run whose upstream reports and upstream.so the gate uses
        default: ''
        type: string
defaults:
  run:
    shell: bash

jobs:
  phpt:
    runs-on: gcrunner=${{ github.run_id }}/runner=standard
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        index: [1, 2, 3, 4, 5, 6]
        engine: ${{ fromJSON(inputs.engines) }}
    # The services upstream's PHPTs expect, as in its scripts/docker-compose.yml, under
    # the host names its tests/include/config.php uses on CI (httpbin at http://httpbin:80).
    services: &services
      httpbin:
        image: kennethreitz/httpbin
        ports: ['80:80']
      pgsql:
        image: postgres:14
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 2s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -proot" --health-interval 2s --health-retries 60
      redis:
        image: redis:7.4
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-retries 30
      # Go's HTTP/2 demo, whose /serverpush pushes four assets (TEST_HTTP2_SERVERPUSH_URL).
      golang-h2demo:
        image: phpswoole/golang-h2demo
        ports: ['4430:4430']
      # HTTP_PROXY_HOST:HTTP_PROXY_PORT and SOCKS5_PROXY_HOST:SOCKS5_PROXY_PORT; the SOCKS5
      # image now refuses to start without credentials unless REQUIRE_AUTH is off.
      tinyproxy:
        image: kalaksi/tinyproxy
        ports: ['8888:8888']
      socks5:
        image: serjs/go-socks5-proxy
        env:
          REQUIRE_AUTH: 'false'
        ports: ['1080:1080']
      # FTP_HOST:FTP_PORT as admin/admin; curl reaches the passive ports on localhost.
      ftp:
        image: teezily/ftpd
        env:
          FTP_USER: admin
          FTP_PASSWORD: admin
          PASV_MIN_PORT: 65000
          PASV_MAX_PORT: 65009
        ports: ['21:21', '65000-65009:65000-65009']
      # Creates /var/lib/firebird/data/test.fdb, the database FIREBIRD_DSN names.
      firebirdsql:
        image: firebirdsql/firebird
        env:
          FIREBIRD_ROOT_PASSWORD: root
          FIREBIRD_USER: test
          FIREBIRD_PASSWORD: test
          FIREBIRD_DATABASE: test.fdb
          FIREBIRD_DATABASE_DEFAULT_CHARSET: UTF8
        ports: ['3050:3050']
      # Serves freepdb1, the service ORACLE_TNS names; the image's own healthcheck.sh
      # reports healthy once the database opens (a minute or two).
      oracle:
        image: gvenzl/oracle-free:slim
        env:
          ORACLE_PASSWORD: oracle
        ports: ['1521:1521']
        options: --health-cmd healthcheck.sh --health-interval 5s --health-retries 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/phpt-env
        with:
          php: ${{ inputs.php }}
      - id: manifest
        env:
          FAMILIES: ${{ inputs.families }}
        run: |
          modules=()
          for family in $FAMILIES; do modules+=(--module "$family"); done
          python3 corpus/upstream/inventory.py --shard ${{ matrix.index }}/6 "${modules[@]}" --output target/phpt/manifest.json
          echo "tests=$(jq '.tests | length' target/phpt/manifest.json)" >> "$GITHUB_OUTPUT"
      # php -n loads nothing; load every extension the distribution enables, in its order.
      - id: extensions
        run: echo "args=$(sed -n 's/^extension=\(.*\)/--php-extension \1/p' /etc/php/*/cli/conf.d/*.ini | sed 's/\.so$//' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      # Exit 1 means some tests failed, which the gate judges; anything else (a runner
      # crash) fails the shard. A few families can leave a shard without tests.
      - if: steps.manifest.outputs.tests != '0'
        run: >
          python3 corpus/upstream/run.py --manifest target/phpt/manifest.json --timeout 30 --external-network
          ${{ steps.extensions.outputs.args }}
          --engine ${{ matrix.engine }}=target/phpt/${{ matrix.engine }}.so
          --output target/phpt/${{ matrix.engine }}-${{ matrix.index }}.json || [ $? -eq 1 ]
      - uses: actions/upload-artifact@v4
        if: always() && steps.manifest.outputs.tests != '0'
        with:
          name: phpt-${{ matrix.engine }}-${{ matrix.index }}
          path: target/phpt/${{ matrix.engine }}-${{ matrix.index }}.json

  gate:
    needs: phpt
    if: always()
    runs-on: gcrunner=${{ github.run_id }}/runner=standard
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    # Same services as the shards: flagged tests are re-run here (#174).
    services: *services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: phpt-*-*
          merge-multiple: true
          path: shards
      # The baseline's upstream reports, cut to the families run here.
      - if: inputs.baseline != ''
        env:
          GH_TOKEN: ${{ github.token }}
          FAMILIES: ${{ inputs.families }}
        run: |
          gh run download ${{ inputs.baseline }} -p 'phpt-upstream-*' -D baseline
          families=$(printf '%s\n' $FAMILIES | jq -R . | jq -sc 'map(select(. != ""))')
          for report in baseline/*/*.json; do
            jq --argjson f "$families" '.results |= map(select(($f | length) == 0 or (.module | IN($f[]))))' \
              "$report" > "shards/$(basename "$report")"
          done
      # Tests that pass on upstream but not on the Cargo build get 3 re-runs per engine, unless
      # more than 20 are flagged: that is a broad breakage, not flakiness.
      - id: flagged
        run: |
          python3 corpus/upstream/gate.py shards/*.json --print-regressions > flagged.txt
          count=$(grep -c . flagged.txt || true)
          echo "rerun=$([ "$count" -gt 0 ] && [ "$count" -le 20 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.flagged.outputs.rerun == 'true'
        uses: ./.github/actions/phpt-env
        with:
          php: ${{ inputs.php }}
      - if: steps.flagged.outputs.rerun == 'true' && inputs.baseline != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download ${{ inputs.baseline }} -n phpt-engines -D baseline-engines
          cp baseline-engines/upstream.so target/phpt/upstream.so
      - if: steps.flagged.outputs.rerun == 'true'
        run: |
          python3 corpus/upstream/inventory.py --output target/phpt/all.json
          extensions=$(sed -n 's/^extension=\(.*\)/--php-extension \1/p' /etc/php/*/cli/conf.d/*.ini | sed 's/\.so$//' | tr '\n' ' ')
          corpus/upstream/recheck.sh shards target/phpt recheck \
            --manifest target/phpt/all.json --timeout 30 --external-network $extensions
      - run: |
          set -- shards/*.json
          if [ -d recheck ]; then set -- "$@" --recheck recheck/*.json; fi
          python3 corpus/upstream/gate.py "$@" --output phpt.json | tee -a "$GITHUB_STEP_SUMMARY"
      # A shard that crashed, or that GitHub never started (an Actions outage drops jobs
      # without a trace in the run), leaves no report; a shard with no tests leaves none either.
      # A gate over some of the shards measured part of the corpus, so its phpt.json is
      # dropped before the upload: the PHPT badge would read it as the whole.
      - if: always() && needs.phpt.result != 'success'
        env:
          ENGINES: ${{ inputs.engines }}
        run: |
          for engine in $(jq -r '.[]' <<< "$ENGINES"); do for index in 1 2 3 4 5 6; do
            [ -f "shards/$engine-$index.json" ] || missing="$missing $engine-$index"
          done; done
          rm -f phpt.json
          echo "A PHPT shard didn't succeed (\`phpt\`: ${{ needs.phpt.result }}); reports missing from the gate:${missing:- none}"
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phpt
          path: |
            phpt.json
            flagged.txt
            recheck/
