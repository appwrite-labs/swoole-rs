name: Miri
# The crates' unit tests, interpreted by Miri for undefined behaviour in their unsafe
# code. Tests Miri can't run in reasonable time, or that call native code, carry
# #[cfg_attr(miri, ignore = "...")]. Every four hours on main, not on PRs: there it
# reported main's own state on each PR and gated nothing (#4704).
# tests/dev/test_miri.py fails when a crate with unsafe code is missing from the package
# lists below, unless it lists the crate with why Miri can't run it.
on:
  schedule:
    - cron: '0 3/4 * * *'
  workflow_dispatch:
concurrency:
  group: miri-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Run the groups in parallel; together they took about 25 minutes.
  # The runtime crates' tests open files and read the clock (isolation off), and
  # assert on whole reads and writes that Miri would otherwise shorten at random.
  miri:
    name: miri (${{ matrix.name }})
    runs-on: gcrunner=${{ github.run_id }}/runner=build
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: leaf
            packages: >-
              swoole-rs-base64 swoole-rs-crc32 swoole-rs-error swoole-rs-error-ffi
              swoole-rs-framing swoole-rs-http2 swoole-rs-httpbindings
          - name: core
            flags: -Zmiri-disable-isolation -Zmiri-no-short-fd-operations
            packages: >-
              swoole-rs-bus swoole-rs-corebase
          - name: clients
            flags: -Zmiri-disable-isolation -Zmiri-no-short-fd-operations
            packages: swoole-rs-clients
          - name: hooks
            flags: -Zmiri-disable-isolation -Zmiri-no-short-fd-operations
            packages: swoole-rs-hooks
          - name: server
            flags: -Zmiri-disable-isolation -Zmiri-no-short-fd-operations
            packages: swoole-rs-server
    env:
      TOOLCHAIN: nightly-2026-10-24
      MIRIFLAGS: ${{ matrix.flags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/rustup
      - name: Install Miri toolchain
        run: rustup toolchain install $TOOLCHAIN --profile minimal --component miri,rust-src
      - name: Set up Miri
        run: cargo +$TOOLCHAIN miri setup
      - name: Miri
        shell: bash
        env:
          PACKAGES: ${{ matrix.packages }}
        run: |
          echo '| Crate | Run | Ignored |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | ---: | ---: |' >> "$GITHUB_STEP_SUMMARY"
          for package in $PACKAGES; do
            status=0
            cargo +"$TOOLCHAIN" miri test --locked --lib -p "$package" | tee "$RUNNER_TEMP/miri.log" || status=$?
            awk -v package="$package" '
              /^test result:/ { print "|", package, "|", $4 + $6, "|", $8, "|"; found = 1 }
              END { if (!found) print "|", package, "| incomplete | — |" }
            ' "$RUNNER_TEMP/miri.log" >> "$GITHUB_STEP_SUMMARY"
            if ((status)); then exit "$status"; fi
          done
