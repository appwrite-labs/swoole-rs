name: Miri
# The crates' unit tests, interpreted by Miri for undefined behaviour in their unsafe
# code. Tests Miri can't run in reasonable time, or that call native code, carry
# #[cfg_attr(miri, ignore = "...")]. Nightly, and on PRs that change a listed crate.
# tests/dev/test_miri.py fails when a crate with unsafe code is missing from both the
# `paths` and a `-p` below, unless it lists the crate with why Miri can't run it.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/miri.yml
      - crates/base64/**
      - crates/buffer/**
      - crates/bus/**
      - crates/clients/**
      - crates/corebase/**
      - crates/coroutine/**
      - crates/crc32/**
      - crates/error-ffi/**
      - crates/error/**
      - crates/framing/**
      - crates/hooks/**
      - crates/http2/**
      - crates/httpbindings/**
      - crates/locks/**
      - crates/memory/**
      - crates/ossupport/**
      - crates/process/**
      - crates/protocols-ffi/**
      - crates/reactor/**
      - crates/server/**
      - crates/timer/**
      - crates/utilities/**
      - crates/websocket-ffi/**
      - tests/modules/buffer/recycling.rs
      - tests/modules/coroutine/channel.rs
      - tests/modules/memory/**
concurrency:
  group: miri-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job per group, in parallel: run one after another they took ~25 minutes. Each
  # group is one cargo invocation, so hooks and server, which turn on upstream-symbols
  # in coroutine, reactor and timer, never share a feature set with the core crates.
  # The runtime crates' tests open files and read the clock (isolation off), and
  # assert on whole reads and writes that Miri would otherwise shorten at random.
  miri:
    name: miri (${{ matrix.name }})
    runs-on: gcrunner=${{ github.run_id }}/runner=build
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: leaf
            packages: >-
              -p swoole-rs-base64 -p swoole-rs-crc32 -p swoole-rs-error -p swoole-rs-error-ffi
              -p swoole-rs-framing -p swoole-rs-http2 -p swoole-rs-httpbindings -p swoole-rs-protocols-ffi
          - name: core
            flags: -Zmiri-disable-isolation -Zmiri-no-short-fd-operations
            packages: >-
              -p swoole-rs-buffer -p swoole-rs-bus -p swoole-rs-corebase -p swoole-rs-coroutine
              -p swoole-rs-locks -p swoole-rs-process -p swoole-rs-reactor -p swoole-rs-utilities
              -p swoole-rs-websocket-ffi
          - name: memory
            flags: -Zmiri-disable-isolation -Zmiri-no-short-fd-operations
            packages: -p swoole-rs-memory -p swoole-rs-ossupport
          # upstream-symbols only adds the timer's Owner and its tests (#3379), so this
          # run covers every test the plain one would.
          - name: timer
            flags: -Zmiri-disable-isolation -Zmiri-no-short-fd-operations
            packages: -p swoole-rs-timer --features upstream-symbols
          # The clients tests' fake ops never free a closed socket (tests read it
          # after close), so its leaks are ignored.
          - name: clients
            flags: -Zmiri-disable-isolation -Zmiri-no-short-fd-operations -Zmiri-ignore-leaks
            packages: -p swoole-rs-clients
          - name: hooks
            flags: -Zmiri-disable-isolation -Zmiri-no-short-fd-operations
            packages: -p swoole-rs-hooks
          - name: server
            flags: -Zmiri-disable-isolation -Zmiri-no-short-fd-operations
            packages: -p swoole-rs-server
    env:
      TOOLCHAIN: nightly-2026-10-24
      MIRIFLAGS: ${{ matrix.flags }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rustup
      - name: Install Miri toolchain
        run: rustup toolchain install $TOOLCHAIN --profile minimal --component miri,rust-src
      - name: Set up Miri
        run: cargo +$TOOLCHAIN miri setup
      - name: Miri
        run: cargo +$TOOLCHAIN miri test --locked --lib ${{ matrix.packages }}
