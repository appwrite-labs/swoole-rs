name: PHP versions
# Upstream and the Cargo-built swoole.so built against each PHP release upstream supports
# (8.2 to 8.5: v6.2.5 refuses 8.1) besides 8.3 (the merge tier's), compiled from source
# by .devcontainer/php.sh, then every PHPT on both in 4 shards. zend-sys binds each
# version's headers, so a struct layout, inline function or VM change breaks the Cargo
# build on that version alone. Any test that passes on upstream must pass on the Cargo
# build. No services: the tests that need one skip on both engines, as do the network ones.
# Nightly; a PR that changes this workflow or php.sh runs it too.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  pull_request:
    paths: [.github/workflows/php-versions.yml, .devcontainer/php.sh]
defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build PHP ${{ matrix.php }}
    runs-on: gcrunner=${{ github.run_id }}/runner=build
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4', '8.5']
    env:
      PHP_SERIES: ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      # Main's release build: the dependencies; zend-sys and the crates above it rebuild
      # against this PHP (PHP_CONFIG). Build trees must start clean.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: false
      - name: Clear cached builds
        run: rm -rf target/ext target/upstream target/thirdparty
      # Restored only: the pinned reference is rebuilt for this PHP below, never saved.
      - uses: actions/cache/restore@v6
        with:
          path: target/upstream
          key: upstream-${{ runner.os }}-${{ hashFiles('tools/build_upstream.py') }}-${{ github.workspace }}
      - uses: actions/cache@v6
        with:
          path: target/php
          key: php-${{ matrix.php }}-${{ runner.os }}-${{ hashFiles('.devcontainer/php.sh') }}-${{ github.workspace }}
      - name: Build PHP
        run: .devcontainer/php.sh target/php
      - name: Fetch crates
        run: cargo fetch --locked
      - name: Build engines
        run: |
          php="--php-config $PWD/target/php/bin/php-config --php-sockets"
          python3 tools/build_upstream.py $php --phpize $PWD/target/php/bin/phpize | tee upstream.log
          python3 tools/build_ext.py $php
          mkdir -p target/phpt
          cp -L "$(sed -n 's/^\(Built\|Cached\) upstream: //p' upstream.log)" target/phpt/upstream.so
          cp target/ext/swoole.so target/phpt/cargo.so
          for engine in upstream cargo; do target/php/bin/php -n -d extension=$PWD/target/phpt/$engine.so -r 'echo PHP_VERSION, " ", swoole_version(), "\n";'; done
      - uses: actions/upload-artifact@v7
        with:
          name: engines-${{ matrix.php }}
          path: target/phpt/

  # A version whose build failed fails its shards too; the others still run.
  phpt:
    name: PHPT PHP ${{ matrix.php }} ${{ matrix.shard }}/4
    needs: build
    if: ${{ !cancelled() }}
    runs-on: gcrunner=${{ github.run_id }}/runner=standard
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4', '8.5']
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      # The pinned tests; this PHP's own build of them lives in the engines artifact.
      - uses: actions/cache/restore@v6
        with:
          path: target/upstream
          key: upstream-${{ runner.os }}-${{ hashFiles('tools/build_upstream.py') }}-${{ github.workspace }}
          # Only the pinned tests are read here, and those don't change with the build script.
          restore-keys: upstream-${{ runner.os }}-
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v6
        with:
          path: target/php
          key: php-${{ matrix.php }}-${{ runner.os }}-${{ hashFiles('.devcontainer/php.sh') }}-${{ github.workspace }}
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v8
        with:
          name: engines-${{ matrix.php }}
          path: target/phpt
      # Exit 1 means some tests failed, which the gate judges. Re-runs as phpt-gate does,
      # unless more than 20 are flagged: that is a broad breakage, not flakiness.
      - name: Run and gate PHPTs
        run: |
          python3 corpus/upstream/inventory.py --shard ${{ matrix.shard }}/4 --output target/phpt/manifest.json
          options="--manifest target/phpt/manifest.json --timeout 30 --php $PWD/target/php/bin/php"
          mkdir -p target/phpt/results
          for engine in upstream cargo; do
            python3 corpus/upstream/run.py $options --engine $engine=target/phpt/$engine.so \
              --output target/phpt/results/$engine.json || [ $? -eq 1 ]
          done
          count=$(python3 corpus/upstream/gate.py target/phpt/results/*.json --print-regressions | grep -c . || true)
          if [ "$count" -le 20 ]; then
            corpus/upstream/recheck.sh target/phpt/results target/phpt target/phpt/recheck $options
          fi
          set -- target/phpt/results/*.json
          if ls target/phpt/recheck/*.json >/dev/null 2>&1; then set -- "$@" --recheck target/phpt/recheck/*.json; fi
          python3 corpus/upstream/gate.py "$@" --output phpt-${{ matrix.php }}-${{ matrix.shard }}.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: phpt-${{ matrix.php }}-${{ matrix.shard }}
          path: |
            phpt-${{ matrix.php }}-${{ matrix.shard }}.json
            target/phpt/results/
            target/phpt/recheck/
