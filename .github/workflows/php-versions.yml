name: PHP versions
# Upstream and the Cargo-built swoole.so built against each PHP release upstream supports
# besides 8.3 (the merge tier's), compiled from source by .devcontainer/php.sh, then every
# PHPT on both in 4 shards. zend-sys binds each version's headers, so a struct layout,
# inline function or VM change breaks the Cargo build on that version alone. Any test
# that passes on upstream must pass on the Cargo build. No services: the tests that
# need one skip on both engines, as do the network ones.
# Nightly; a PR that changes this workflow or php.sh runs it too.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  pull_request:
    paths: [.github/workflows/php-versions.yml, .devcontainer/php.sh]
env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 500M
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.4', '8.5']
    env:
      PHP_SERIES: ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4
      # Main's release build: the dependencies; zend-sys and the crates above it rebuild
      # against this PHP (PHP_CONFIG). Build trees must start clean.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: false
      - run: rm -rf target/ext target/upstream target/thirdparty target/native-core
      - uses: ./.github/actions/install
      # Restored only: the pinned reference is rebuilt for this PHP below, never saved.
      - uses: actions/cache/restore@v4
        with:
          path: target/upstream
          key: upstream-${{ runner.os }}-${{ hashFiles('tools/build_upstream.py') }}
      - uses: actions/cache@v4
        with:
          path: target/php
          key: php-${{ matrix.php }}-${{ runner.os }}-${{ hashFiles('.devcontainer/php.sh') }}
      - run: .devcontainer/php.sh target/php
      # Other headers, so few hits; never saved, so the nightly runs can't evict main's caches.
      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-
      - run: cargo fetch --locked
      - run: |
          php="--php-config $PWD/target/php/bin/php-config --php-sockets"
          python3 tools/build_upstream.py $php --phpize $PWD/target/php/bin/phpize
          python3 tools/build_ext.py $php
          mkdir -p target/phpt
          cp -L target/upstream/src/modules/swoole.so target/phpt/upstream.so
          cp target/ext/swoole.so target/phpt/cargo.so
          for engine in upstream cargo; do target/php/bin/php -n -d extension=$PWD/target/phpt/$engine.so -r 'echo PHP_VERSION, " ", swoole_version(), "\n";'; done
      - uses: actions/upload-artifact@v4
        with:
          name: engines-${{ matrix.php }}
          path: target/phpt/

  phpt:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.4', '8.5']
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install
      # The pinned tests; this PHP's own build of them lives in the engines artifact.
      - uses: actions/cache/restore@v4
        with:
          path: target/upstream
          key: upstream-${{ runner.os }}-${{ hashFiles('tools/build_upstream.py') }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: target/php
          key: php-${{ matrix.php }}-${{ runner.os }}-${{ hashFiles('.devcontainer/php.sh') }}
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v4
        with:
          name: engines-${{ matrix.php }}
          path: target/phpt
      # Exit 1 means some tests failed, which the gate judges. Re-runs as phpt-gate does,
      # unless more than 20 are flagged: that is a broad breakage, not flakiness.
      - run: |
          python3 corpus/upstream/inventory.py --shard ${{ matrix.shard }}/4 --output target/phpt/manifest.json
          options="--manifest target/phpt/manifest.json --timeout 30 --php $PWD/target/php/bin/php"
          mkdir -p target/phpt/results
          for engine in upstream cargo; do
            python3 corpus/upstream/run.py $options --engine $engine=target/phpt/$engine.so \
              --output target/phpt/results/$engine.json || [ $? -eq 1 ]
          done
          count=$(python3 corpus/upstream/gate.py target/phpt/results/*.json --print-regressions | grep -c . || true)
          if [ "$count" -le 20 ]; then
            corpus/upstream/recheck.sh target/phpt/results target/phpt target/phpt/recheck $options
          fi
          set -- target/phpt/results/*.json
          if ls target/phpt/recheck/*.json >/dev/null 2>&1; then set -- "$@" --recheck target/phpt/recheck/*.json; fi
          python3 corpus/upstream/gate.py "$@" --output phpt-${{ matrix.php }}-${{ matrix.shard }}.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phpt-${{ matrix.php }}-${{ matrix.shard }}
          path: |
            phpt-${{ matrix.php }}-${{ matrix.shard }}.json
            target/phpt/results/
            target/phpt/recheck/
